<script>
var H=[{"id": 1, "n": "肉桂", "la": "Cinnamomum cassia", "cat": "補益類", "sub": "溫裡", "pr": "辛、甘，大熱", "me": "腎、脾、心、肝", "fn": "補火助陽、引火歸元", "af": "我內在的火焰明亮，溫暖照亮我的路", "mo": "「點燃心中的小火爐。」", "yo": "引火歸元，把焦慮轉化為溫暖心窩的能量。", "img": "rougui", "bs": "身體寒冷、手腳冰涼、精神不振", "rd": ["你有多久，沒有從身體裡真正暖過來了？", "肉桂辛、甘而大熱，走腎、脾、心、肝。中醫用它補火助陽、引火歸元——把那些飄在外頭、假裝熱鬧的虛火，一路帶回丹田，讓你從最深處真正暖起來。", "手腳冰冷、提不起勁的時候，你要的往往不是更多刺激，而是一爐穩穩燒著的火。", "回到自己的中心，把那盞小火爐點上。根一暖，人就有力氣了。"]}, {"id": 2, "n": "乾薑", "la": "Zingiber officinale (dried)", "cat": "補益類", "sub": "溫裡", "pr": "辛，熱", "me": "脾、胃、腎、心、肺", "fn": "溫中散寒、回陽通脈、溫肺化飲", "af": "溫暖的能量融化寒冰，感受重新流動", "mo": "「從核心溫暖起來。」", "yo": "溫中散寒，讓冰封的內在重新流動。", "img": "ganjiang", "bs": "身體寒冷、手腳冰涼、精神不振", "rd": ["寒到深處的時候，講道理沒用，得先生一盆火。", "這正是乾薑在做的事。它辛、熱，入脾、胃、腎、心、肺，溫中散寒、回陽通脈——像替凍住的核心點起爐火，讓卡住的血脈重新流動。", "如果你整個人都是涼的、懶的、提不起神，那是寒把生機困住了。這時候別硬撐，撐只會更冷。", "讓自己從裡到外暖回來。中焦的火一亮，精神會跟著回魂。"]}, {"id": 3, "n": "丁香", "la": "Syzygium aromaticum", "cat": "補益類", "sub": "溫裡", "pr": "辛，溫", "me": "脾、胃、腎", "fn": "溫中降逆、補腎助陽", "af": "我接受生命的一切，順應自然的氣息", "mo": "「芬芳中的溫暖。」", "yo": "溫中降逆，用香氣化解胃中的寒涼翻騰。", "img": "dingxiang", "bs": "身體寒冷、手腳冰涼、精神不振", "rd": ["溫暖不一定要大張旗鼓，也可以是一縷香。", "丁香辛而溫，入脾、胃、腎，中醫用它溫中降逆、補腎助陽。它像帶著香氣的暖流，一面把往上翻的悶噁安撫下去，一面悄悄替腎裡的陽添一把柴。", "身體怕冷、精神懶懶、胃裡老覺得悶脹想逆——那是中焦有寒、氣往上頂。", "別急，讓自己在這股芬芳裡定下來。細水長流的暖，比一時的烈更能養人。"]}, {"id": 4, "n": "小茴香", "la": "Foeniculum vulgare", "cat": "補益類", "sub": "溫裡", "pr": "辛，溫", "me": "肝、腎、脾、胃", "fn": "散寒止痛、理氣和胃", "af": "我的情緒自由流動，寒意在溫柔中解開", "mo": "「溫柔解開糾結。」", "yo": "散寒止痛，讓緊縮的腹中恢復舒展。", "img": "xiaohuixiang", "bs": "身體寒冷、手腳冰涼、精神不振", "rd": ["寒一來，身體就縮成一團；那些抽緊打結的地方，其實在等一雙暖手。", "小茴香辛、溫，入肝、腎、脾、胃，能散寒止痛、理氣和胃。寒散了、氣順了，原本揪著的地方，就像被溫熱按過那樣鬆開。", "小腹或身側悶脹抽緊、渾身發冷提不起勁時，多半是寒夾著氣滯卡住了。緊繃要的不是用力，是溫度。", "給自己一點暖、一點耐心，慢慢把身體和心裡的結解開。鬆了，路就順了。"]}, {"id": 5, "n": "吳茱萸", "la": "Evodia rutaecarpa", "cat": "補益類", "sub": "溫裡", "pr": "辛、苦，熱", "me": "肝、脾、胃、腎", "fn": "散寒止痛、降逆止嘔、助陽止瀉", "af": "我平息內在的混亂，讓平靜重新降臨", "mo": "「驅散深處的寒意。」", "yo": "散寒止痛，將藏在角落的寒氣一掃而空。", "img": "wuzhuyu", "bs": "身體寒冷、手腳冰涼、精神不振", "rd": ["有些寒，藏得很深，淺淺的暖搆不到。", "吳茱萸辛、苦而熱，入肝、脾、胃、腎，散寒止痛、降逆止嘔，力道直往深處去，專治那種盤踞在裡面、頑固不化的冷。", "當你特別畏寒、身體冷痛，連情緒都跟著沉下去，那是深層的寒困住了你——它需要更堅定的溫暖來化。", "別輕看那股藏在深處的寒意。給足暖與休息，一點一點把它逼出去，你會重新踏實起來。"]}, {"id": 6, "n": "人參", "la": "Panax ginseng", "cat": "補益類", "sub": "補氣", "pr": "甘、微苦，微溫", "me": "脾、肺、心、腎", "fn": "大補元氣、安神益智", "af": "我的內在力量源源不絕，我值得被滋養", "mo": "「大補元氣，重啟核心。」", "yo": "當你感到空虛時，記得找回最原始的力量。", "img": "renshen", "bs": "疲倦乏力、氣短懶言、精神不濟", "rd": ["你是不是已經很久，沒有好好被照顧了？", "人參甘、微苦而偏溫，入脾、肺、心、腎——中醫說它大補元氣，補的是你最底層、最根本的那口氣；這口氣足了，人才撐得起來。", "會遇到它，多半因為你正被掏空著：做什麼都提不起勁，連說話都嫌費力。這不是懶，是核心真的空了。", "它給的功課不是再努力，而是允許自己停下來、被滋養。核心一旦填滿，力氣會自己回來。"]}, {"id": 7, "n": "黃耆", "la": "Astragalus membranaceus", "cat": "補益類", "sub": "補氣", "pr": "甘，微溫", "me": "脾、肺", "fn": "益氣固表、利尿托毒", "af": "我有堅固的能量屏障，保護我不受侵擾", "mo": "「為自己築起護城河。」", "yo": "補足了氣，外在的紛擾就再也傷不了你。", "img": "huangqi", "bs": "疲倦乏力、氣短懶言、精神不濟", "rd": ["在張羅每個人之前，你有先把自己守好嗎？", "黃耆甘、微溫，入脾、肺，中醫用它益氣固表——一面把中氣補足，一面在體表撐起一層看不見的護牆，讓你不那麼容易被消耗掏空。", "老是累、動不動就虛、一忙就撐不住，不是你不夠強，是你把自己守得太少。", "先築好那道護城河吧。氣足了、界線立起來了，你才有餘力去照顧別人。"]}, {"id": 8, "n": "紅棗", "la": "Ziziphus jujuba", "cat": "補益類", "sub": "補氣", "pr": "甘，溫", "me": "脾、胃", "fn": "補中益氣、養血安神", "af": "我被溫柔包圍，內心感到安穩與滿足", "mo": "「給生活一點紅潤。」", "yo": "脾胃安穩了，心情也會跟著甜美起來。", "img": "hongzao", "bs": "疲倦乏力、氣短懶言、精神不濟", "rd": ["日子太淡的時候，需要一點紅、一點甜。", "紅棗甘、溫，入脾、胃，補中益氣、養血安神。它一點也不花俏，像一碗溫熱的湯，默默把氣血補起來，也把慌慌的心安下來。", "臉色不好、容易累、心定不下來——那是中氣和血都虛了。這種時候，最樸素的照顧最有力。", "好好吃飯、好好睡、對自己軟一點。平凡的溫柔，會一天天把你養回紅潤。"]}, {"id": 9, "n": "山藥", "la": "Dioscorea opposita", "cat": "補益類", "sub": "補氣", "pr": "甘，平", "me": "脾、肺、腎", "fn": "補脾養胃、生津益肺", "af": "我能從容轉化生命經驗，成為成長養分", "mo": "「不溫不火的滋養。」", "yo": "最好的補給，是潤物無聲地融入日常。", "img": "shanyao", "bs": "疲倦乏力、氣短懶言、精神不濟", "rd": ["不是所有的滋養都要轟轟烈烈；有一種，是安安靜靜地墊在底下。", "山藥甘、平，脾、肺、腎都補。它不寒不熱、不偏不倚，像地基一樣，一點一點把你的根本補厚。", "常覺得疲、氣不夠、腸胃又弱？那是脾氣虛。你需要的不是猛補，是持續而溫和的照料。", "用不急不火的方式待自己：規律、溫和、不勉強。慢慢養，根才扎得穩。"]}, {"id": 10, "n": "靈芝", "la": "Ganoderma lucidum", "cat": "補益類", "sub": "補氣", "pr": "甘，平", "me": "心、肺、肝、腎", "fn": "補氣安神、止咳平喘", "af": "我與宇宙的智慧相連，內在平和而覺醒", "mo": "「與天地同呼吸。」", "yo": "補氣安神，開啟身心與宇宙的智慧連結。", "img": "lingzhi", "bs": "疲倦乏力、氣短懶言、精神不濟", "rd": ["靈芝長在深山的老木上，不慌不忙，與天地一同呼吸。", "靈芝甘、平，入心、肺、肝、腎，補氣也安神。它補得深、也補得靜，一面添氣力，一面把浮躁的心神按回原位。", "身心俱疲、睡不安穩、連呼吸都覺得淺——那是氣不足、神不寧的訊號。", "深深吸一口氣，和天地同一個節奏。氣足神安，那份綿長的定力就回來了。"]}, {"id": 11, "n": "黨參", "la": "Codonopsis pilosula", "cat": "補益類", "sub": "補氣", "pr": "甘，平", "me": "脾、肺", "fn": "健脾益肺、養血生津", "af": "我以穩定的步伐前進，力量持續累積", "mo": "「每一天的日常，都值得細心補給。」", "yo": "平凡的積累，終能成就脾胃的底氣。", "img": "dangshen", "bs": "疲倦乏力、氣短懶言、精神不濟", "rd": ["力氣不是一天補出來的，是一天天攢的。", "黨參甘、平，入脾、肺，健脾益肺、養血生津，是溫和版的補氣藥。它不猛，勝在穩，最適合每天一點一點地把氣血補回來。", "總覺得沒力、話懶得說、精神差？那是脾肺氣虛。與其等透支了才急救，不如天天給自己一點溫和的補給。", "別小看日常。好好吃、好好歇，一天穩一點，底氣就一天厚一點。"]}, {"id": 12, "n": "白朮", "la": "Atractylodes macrocephala", "cat": "補益類", "sub": "補氣", "pr": "苦、甘，溫", "me": "脾、胃", "fn": "健脾益氣、燥濕利水、止汗安胎", "af": "我的內在井然有序，清明而穩定", "mo": "「排解心中的濕重。」", "yo": "健脾化濕，讓沉重的心情恢復清爽。", "img": "baizhu", "bs": "疲倦乏力、氣短懶言、精神不濟", "rd": ["又累又重，像身上裹了一層濕棉被——這種沉，補氣還不夠，得把濕也化掉。", "白朮苦、甘而溫，入脾、胃，健脾益氣、燥濕利水。它一手補脾氣，一手把滯住的濕氣化開，讓你不再又疲又沉。", "疲倦乏力、身體發沉、頭腦昏昏的，多半是脾虛生了濕。", "把中焦顧好，也把心裡那股濕悶清一清。脾氣足、濕氣散，人就乾爽輕盈了。"]}, {"id": 13, "n": "西洋參", "la": "Panax quinquefolius", "cat": "補益類", "sub": "補氣", "pr": "甘、微苦，涼", "me": "心、肺、腎", "fn": "補氣養陰、清熱生津", "af": "我以清涼的方式滋養自己，恢復平靜", "mo": "「在冷靜中補給。」", "yo": "不需要燥進，也能在平和中養出滿滿的元氣。", "img": "xiyangshen", "bs": "疲倦乏力、氣短懶言、精神不濟", "rd": ["補，不一定要補到上火。", "西洋參甘、微苦而涼，入心、肺、腎，補氣養陰、清熱生津。它跟人參不一樣，補了氣卻不助火，正適合又累又帶點燥的你。", "明明很疲，卻又心煩口乾、越忙越上火——那是氣陰兩虛。這種時候，一味涼潤的補，勝過燥熱的猛補。", "在冷靜裡補自己：補氣，也補水；做事，也留白。氣陰一起養，才不會越補越燥。"]}, {"id": 14, "n": "甘草", "la": "Glycyrrhiza uralensis", "cat": "補益類", "sub": "補氣", "pr": "甘，平", "me": "心、肺、脾、胃", "fn": "補脾益氣、清熱解毒", "af": "我調和內外的一切，在圓滿中獲得自在", "mo": "「與世界達成和解。」", "yo": "調和諸藥的力量，是讓一切矛盾都化為圓滿。", "img": "gancao", "bs": "疲倦乏力、氣短懶言、精神不濟", "rd": ["有時候，最有力量的不是對抗，是把僵持的兩邊好好調和。", "甘草甘、平，入心、肺、脾、胃，補脾益氣、清熱解毒，在方子裡素有「和事佬」之稱——能調和各種藥性，讓互相衝突的力量重新協調。", "身心俱疲、內在有股說不清的拉扯與不和，那是在提醒你：該緩一緩、和解一下了。", "試著跟世界、也跟自己講和。內在一協調，緊繃鬆了，力氣就回來了。"]}, {"id": 15, "n": "當歸", "la": "Angelica sinensis", "cat": "補益類", "sub": "補血", "pr": "甘、辛，溫", "me": "肝、心、脾", "fn": "補血活血、調經止痛", "af": "愛的能量在我體內流動，滋養每個細胞", "mo": "「讓愛流動，適時回歸。」", "yo": "活血補血，讓心底凝滯的委屈重新流動。", "img": "danggui", "bs": "面色蒼白、心悸失眠、情感空虛", "rd": ["「當歸」這名字，本就是「應當歸來」的意思。", "它甘、辛而溫，入肝、心、脾，是補血的代表——既補血又活血，把虧的補上、把瘀的推開，讓生命之流重新溫暖地繞回來。", "臉色蒼白、心悸難眠、心裡空落落的，那是血虛養不住神與情。你需要被滋養，也需要把散在外頭的自己收回來。", "讓愛流動，也記得回家。先把自己補滿，愛才有源頭。"]}, {"id": 16, "n": "桂圓", "la": "Dimocarpus longan", "cat": "補益類", "sub": "補血", "pr": "甘，溫", "me": "心、脾", "fn": "補心安神、養血益脾", "af": "我的心安住當下，寧靜而圓滿", "mo": "「圓滿自己的心房。」", "yo": "補心安神，讓不安的靈魂找到溫暖歸宿。", "img": "guiyuan", "bs": "面色蒼白、心悸失眠、情感空虛", "rd": ["想要圓滿，得先把自己的心房填滿。", "桂圓甘、溫，入心、脾，補心安神、養血益脾。它甜潤溫暖，一面補養心血，一面安撫那顆容易慌、容易空的心。", "心悸、睡不安穩、情感上覺得有點空——那是心脾兩虛、心血不足。這種空，要用溫暖慢慢填。", "允許被愛，也好好愛自己。心血一豐盈，你會由裡到外地飽滿安定。"]}, {"id": 17, "n": "制何首烏", "la": "Polygonum multiflorum (processed)", "cat": "補益類", "sub": "補血", "pr": "苦、甘、澀，微溫", "me": "肝、腎", "fn": "補肝腎、益精血、烏鬚髮", "af": "我擁抱生命的每個階段，智慧與活力並存", "mo": "「留住美好的光澤。」", "yo": "由內而外的滋養，能讓時光在髮間停留。", "img": "zhiheshouwu", "bs": "面色蒼白、心悸失眠、情感空虛", "rd": ["那種由內散發的光澤，從來不是保養品給的，是根本養出來的。", "制何首烏苦、甘、澀而微溫，入肝、腎，補肝腎、益精血。它補的是最深層的精血——身體最根本的存款，滿了，人自然有神采。", "臉色黯淡、容易累、覺得像被掏空，那是精血不足。表面的憔悴，往往來自根本的虧。", "從根補起，別急著追外表。肝腎精血一飽，那份光澤會自己回到你身上。"]}, {"id": 18, "n": "阿膠", "la": "Equus asinus (Colla Corii Asini)", "cat": "補益類", "sub": "補血", "pr": "甘，平", "me": "肺、肝、腎", "fn": "補血滋陰、潤燥止血", "af": "我的生命如甘泉湧流，充滿滋潤與甜美", "mo": "「修補心靈的裂痕。」", "yo": "滋陰補血，為疲憊的靈魂覆蓋一層保護膜。", "img": "ejiao", "bs": "面色蒼白、心悸失眠、情感空虛", "rd": ["有些裂痕，不是裝作沒事就會好，是要慢慢修補的。", "阿膠甘、平，入肺、肝、腎，是補血滋陰的名藥，擅長把虧掉的血與陰一點點補回，把乾裂的地方潤養起來。", "臉色蒼白、心悸失眠、身心都有點乾涸空虛——那是血虛陰虧，需要沉靜而滋潤的修復。", "給自己時間補那道裂縫。不必急著完好，慢慢養，缺口也會長出新的柔軟。"]}, {"id": 19, "n": "白芍", "la": "Paeonia lactiflora", "cat": "補益類", "sub": "補血", "pr": "苦、酸，微寒", "me": "肝、脾", "fn": "養血調經、斂陰止汗", "af": "我的內在柔軟有彈性，優雅地面對壓力", "mo": "「溫柔地擁抱情緒。」", "yo": "柔肝止痛，讓緊繃的身體在愛中放鬆。", "img": "baishao", "bs": "面色蒼白、心悸失眠、情感空虛", "rd": ["對情緒，硬壓不如溫柔地抱住它。", "白芍苦、酸而微寒，入肝、脾，養血斂陰、柔肝止痛。它最擅長「柔肝」——把緊繃剛硬的肝氣，養得柔軟、有彈性。", "情緒繃著、動不動就煩、臉色也不好，那是肝血不足、肝氣失了柔。越硬撐，越容易斷。", "溫柔地把自己的情緒抱起來。內在被血養潤了，你就能屈能伸，不再一碰就傷。"]}, {"id": 20, "n": "枸杞子", "la": "Lycium barbarum", "cat": "補益類", "sub": "補陰", "pr": "甘，平", "me": "肝、腎", "fn": "滋補肝腎、益精明目", "af": "我以清澈的雙眼看見生命中的美好", "mo": "「用清澈的眼看世界。」", "yo": "滋補肝腎，讓你的視野永遠明亮溫柔。", "img": "gouqizi", "bs": "口乾舌燥、心煩失眠、內熱焦躁", "rd": ["看不清，有時不是眼睛的事，是裡面的水不夠了。", "枸杞子甘、平，入肝、腎，滋補肝腎、益精明目。中醫說「肝開竅於目」，肝腎的精血一足，眼睛和心神都會跟著清亮。", "眼睛乾澀、容易累、心也有點躁——那是肝腎陰精不足。", "好好滋養自己，用一雙清澈的眼重新看世界。根本補上了，你會看得更亮，也更柔軟。"]}, {"id": 21, "n": "熟地黃", "la": "Rehmannia glutinosa (processed)", "cat": "補益類", "sub": "補陰", "pr": "甘，微溫", "me": "肝、腎", "fn": "滋陰補血、益精填髓", "af": "我深深扎根於大地，內在充實而穩固", "mo": "「在深度中紮根。」", "yo": "滋陰填髓，在安靜中補足最深層的生命力。", "img": "shudihuang", "bs": "口乾舌燥、心煩失眠、內熱焦躁", "rd": ["越忙的時候，掏掉的往往是最深的那筆存款。", "熟地黃甘、微溫，入肝、腎，滋陰補血、益精填髓，是厚重的補藥，直達根本的精髓，替你重新蓄滿底氣。", "被掏空的感覺、腰膝無力、心煩難眠，那是陰血與精髓都虧了。", "往下扎根吧。慢下來，把根本養厚，你才撐得起向上的那一切。"]}, {"id": 22, "n": "天門冬", "la": "Asparagus cochinchinensis", "cat": "補益類", "sub": "補陰", "pr": "甘、苦，寒", "me": "肺、腎", "fn": "養陰潤燥、清肺生津", "af": "我平息燥熱的情緒，恢復冰清般的冷靜", "mo": "「在乾涸中保持清涼。」", "yo": "養陰潤燥，即使烈日當空也能保持內心清潤。", "img": "tianmendong", "bs": "口乾舌燥、心煩失眠、內熱焦躁", "rd": ["燥熱裡，最珍貴的是一口清涼。", "天門冬甘、苦而寒，入肺、腎，養陰潤燥、清肺生津。它清中帶潤，一面降那股虛火，一面把乾掉的津液補回來。", "口乾舌燥、心煩、夜裡睡不安，那是肺腎陰虛、虛火上擾。這種乾，靠潤來解，不靠壓。", "給自己足夠的水和靜。陰液一回來，內在的燥熱自然就退了。"]}, {"id": 23, "n": "百合", "la": "Lilium brownii", "cat": "補益類", "sub": "補陰", "pr": "甘，微寒", "me": "心、肺", "fn": "養陰潤肺、清心安神", "af": "我的心如百合般純淨，在寧靜中綻放", "mo": "「純淨的心，自有力量。」", "yo": "養陰潤肺，讓心靈如百合般澄澈安寧。", "img": "baihe", "bs": "口乾舌燥、心煩失眠、內熱焦躁", "rd": ["有些累，是睡一覺也補不回來的——那是心裝得太滿、想得太多，把自己燒乾了。", "百合甘而微寒，走的是心與肺。它不急著替你解決什麼，只是安靜地養陰、清心，像在悶熱的房間裡推開一扇窗，讓涼意一點一點滲進來。", "你最近是不是常覺得口乾、心煩，夜裡翻來覆去睡不著？那不是你不夠堅強，是心肺裡那點濕潤被耗掉了。", "它想說的其實很簡單：別再用力了。慢下來，讓自己像它一樣，在安靜裡一瓣一瓣地開。純淨，從來就是一種力量。"]}, {"id": 24, "n": "麥門冬", "la": "Ophiopogon japonicus", "cat": "補益類", "sub": "補陰", "pr": "甘、微苦，微寒", "me": "心、肺、胃", "fn": "養陰生津、潤肺清心", "af": "我以甘潤滋養心田，讓清涼泉水流過", "mo": "「滋潤每一寸乾涸。」", "yo": "養陰生津，為枯竭的心田注入清泉。", "img": "maimendong", "bs": "口乾舌燥、心煩失眠、內熱焦躁", "rd": ["心裡有些角落，被燒得乾乾的，是時候澆點水了。", "麥門冬甘、微苦而微寒，入心、肺、胃，養陰生津、潤肺清心。它像一泓甘涼的泉，把心、肺、胃裡的乾與熱，一寸一寸潤開。", "口乾、心煩、睡不好、內在焦躁——那是陰津不足、心肺失了潤。越焦越乾，越乾越焦。", "讓自己被滋潤：多喝水、多留白、少燃燒。每一寸乾涸重新濕潤了，心也就清涼安定了。"]}, {"id": 25, "n": "玉竹", "la": "Polygonatum odoratum", "cat": "補益類", "sub": "補陰", "pr": "甘，微寒", "me": "肺、胃", "fn": "養陰潤燥、生津止渴", "af": "我找回內在的潤澤，重新連結美的感知", "mo": "「柔韌地穿越乾旱。」", "yo": "養陰潤燥，溫柔而持久地滋養生命。", "img": "yuzhu", "bs": "口乾舌燥、心煩失眠、內熱焦躁", "rd": ["穿越乾旱，靠的不是硬撐，是柔韌。", "玉竹甘、微寒，入肺、胃，養陰潤燥、生津止渴。它滋潤卻不膩，補得溫和，像替乾裂的土地慢慢滲進水。", "口乾、燥熱、心煩失眠，那是肺胃陰虛、津液不足。越是乾旱，越需要溫柔而持續的滋養。", "把自己潤養得有彈性一些。不必跟乾旱硬碰，你會柔柔地走過這一段。"]}, {"id": 26, "n": "冬蟲夏草", "la": "Cordyceps sinensis", "cat": "補益類", "sub": "補陽", "pr": "甘，平", "me": "肺、腎", "fn": "補肺益腎、止血化痰", "af": "我在蛻變中更加完整，生命不斷更新", "mo": "「跨越季節的等待。」", "yo": "在沉默中蛻變，只為補足生命最深刻的氣。", "img": "dongchongxiacao", "bs": "畏寒怕冷、腰膝酸軟、動力不足", "rd": ["有些力量，是在漫長的等待與轉化裡，才慢慢長成的。", "冬蟲夏草甘、平，入肺、腎，補肺益腎，平補陰陽、不燥不烈——像熬過寒冬與盛夏才成形的它，補得緩，也補得穩。", "畏寒、腰膝酸軟、提不起勁，那是肺腎兩虛、根本的能量弱了。這種虛急不得。", "給自己足夠的時間和滋養。力量會在你不催它的時候，悄悄長回來。"]}, {"id": 27, "n": "續斷", "la": "Dipsacus asperoides", "cat": "補益類", "sub": "補陽", "pr": "苦、辛，微溫", "me": "肝、腎", "fn": "補肝腎、強筋骨、續折傷", "af": "我溫柔撫平傷痛，讓勇氣重新連結", "mo": "「連結斷點，重新出發。」", "yo": "續筋接骨，受過的傷會讓你變得更強壯。", "img": "xuduan", "bs": "畏寒怕冷、腰膝酸軟、動力不足", "rd": ["斷掉的地方，不是終點，是等著被接上的地方。", "續斷苦、辛而微溫，入肝、腎，補肝腎、強筋骨、續折傷——光名字就寫著它的本事：把斷開的重新連上，把受損的筋骨補起來。", "腰膝酸軟、身體虛冷、覺得動力斷了線，那是肝腎不足、筋骨失養。", "把根本補回來，重新接上、重新出發。那些以為斷了的，會用更韌的方式續下去。"]}, {"id": 28, "n": "補骨脂", "la": "Psoralea corylifolia", "cat": "補益類", "sub": "補陽", "pr": "辛、苦，溫", "me": "腎、脾", "fn": "補腎壯陽、固精縮尿", "af": "我點燃內在的火種，照亮前行的道路", "mo": "「重建生命的骨架。」", "yo": "補腎壯陽，讓動搖的根基再次穩固。", "img": "buguzhi", "bs": "畏寒怕冷、腰膝酸軟、動力不足", "rd": ["地基一鬆，蓋得再高也晃。", "補骨脂辛、苦而溫，入腎、脾，補腎壯陽、固精縮尿，溫補的是下焦那股根本的陽氣，像替搖晃的地基重新打樁。", "畏寒、腰膝無力、精神提不起來，那是腎陽不足、根基不穩。撐不住，常是底下的骨架先鬆了。", "從根本把骨架立穩。腎陽補實了，你會重新站直、走穩，也更有往前的勁。"]}, {"id": 29, "n": "淫羊藿", "la": "Epimedium brevicornu", "cat": "補益類", "sub": "補陽", "pr": "辛、甘，溫", "me": "肝、腎", "fn": "補腎陽、強筋骨、祛風濕", "af": "我擁抱生命的熱情，展現強大的生命力", "mo": "「喚醒沉睡的熱情。」", "yo": "補腎陽強筋骨，重燃生命的火焰。", "img": "yinyanghuo", "bs": "畏寒怕冷、腰膝酸軟、動力不足", "rd": ["那份熱情不是消失了，只是睡著了。", "淫羊藿辛、甘而溫，入肝、腎，補腎陽、強筋骨。它溫暖而振奮，最擅長把低沉下去的陽氣重新提起來。", "畏寒、腰膝酸軟、對什麼都提不起興致，那是腎陽不足、生命力偏弱——冷淡與無力，常是陽氣沉睡的樣子。", "溫柔地把內在的熱情喚醒。陽氣一提，暖回來了、動力回來了，你對生活也重新有了興味。"]}, {"id": 30, "n": "肉蓯蓉", "la": "Cistanche deserticola", "cat": "補益類", "sub": "補陽", "pr": "甘、鹹，溫", "me": "腎、大腸", "fn": "補腎陽、益精血、潤腸通便", "af": "我恢復流暢的步調，讓生活充滿潤澤", "mo": "「沙漠中的生命力。」", "yo": "補腎益精，在貧瘠中依然綻放力量。", "img": "roucongrong", "bs": "畏寒怕冷、腰膝酸軟、動力不足", "rd": ["再荒涼的沙漠，也有頑強生長的東西。", "肉蓯蓉甘、鹹而溫，入腎、大腸，補腎陽、益精血，溫潤而不燥——補陽的同時還能潤養，像沙漠裡那株怎麼也曬不死的植物。", "畏寒、腰膝無力、身心有點乾枯疲乏，那是腎陽與精血都不足。這種枯，要用溫潤來補。", "相信荒涼裡也有生機。溫和地養自己，你會在看似枯竭的時期，長出意想不到的綠。"]}, {"id": 31, "n": "杜仲", "la": "Eucommia ulmoides", "cat": "補益類", "sub": "補陽", "pr": "甘，溫", "me": "肝、腎", "fn": "補肝腎、強筋骨、安胎", "af": "我的意志堅韌強健，能承載生命的目標", "mo": "「韌性，是斷不了的連結。」", "yo": "強筋壯骨，內在的絲線能撐起受傷的你。", "img": "duzhong", "bs": "畏寒怕冷、腰膝酸軟、動力不足", "rd": ["真正的強，不是硬，是斷不了的韌。", "杜仲甘、溫，入肝、腎，補肝腎、強筋骨，補得溫和又扎實，專門強健撐起身體的筋骨與腰膝。", "腰膝酸軟、身體發冷、覺得快撐不住，那是肝腎不足、筋骨失養——撐不住，是要你去補強的訊號。", "把根本補穩，養出一種斷不了的韌性。你會像杜仲的絲那樣：柔軟，卻怎麼扯都扯不斷。"]}, {"id": 32, "n": "鹿茸", "la": "Cervus nippon (Cornu Cervi Pantotrichum)", "cat": "補益類", "sub": "補陽", "pr": "甘、鹹，溫", "me": "腎、肝", "fn": "壯腎陽、益精血、強筋骨", "af": "我承接金色的能量，展現自信與尊貴", "mo": "「蓬勃向上的生長力。」", "yo": "壯腎陽益精血，如春日鹿角般充滿生機。", "img": "lurong", "bs": "畏寒怕冷、腰膝酸軟、動力不足", "rd": ["春天鹿角初生時，那股往上猛長的勁，最像生命本來的樣子。", "鹿茸甘、鹹而溫，入腎、肝，大補腎陽、益精血，是力道十足的峻補之藥。", "特別畏寒、腰膝無力、整個人像洩了氣，那是腎陽與精血大虛，需要有力的溫補來扶起。", "把那股蓬勃向上的力氣喚回來（峻補之品，服用請遵醫囑）。根本一實，你會重新感到生機盎然。"]}, {"id": 33, "n": "牛膝", "la": "Achyranthes bidentata", "cat": "理氣活血類", "sub": "活血", "pr": "苦、甘、酸，平", "me": "肝、腎", "fn": "逐瘀通經、補肝腎、引血下行", "af": "我將能量平穩下沉，腳踏實地感受大地", "mo": "「引導能量向下扎根。」", "yo": "引血下行，讓上衝的躁動回歸穩定。", "img": "niuxi", "bs": "情緒鬱結、胸悶刺痛、循環不暢", "rd": ["想得太多、火氣太上頭時，身體會替你喊：往下走。", "牛膝苦、甘、酸而平，入肝、腎，逐瘀通經、補肝腎，還能「引血下行」——把往上衝、往上浮的氣血，溫和地帶回下方。", "情緒鬱結、頭重胸悶、循環不暢，那是氣血又瘀又浮。", "把能量往下引，回到身體、回到當下。氣血一沉、瘀一化，你就重新踏實了。"]}, {"id": 34, "n": "三七", "la": "Panax notoginseng", "cat": "理氣活血類", "sub": "活血", "pr": "甘、微苦，溫", "me": "肝、胃", "fn": "散瘀止血、消腫定痛", "af": "我化解深層的瘀結，迎來全新的生命", "mo": "「止住傷口，化解舊痛。」", "yo": "散瘀止血，讓創傷不再是負擔。", "img": "sanqi", "bs": "情緒鬱結、胸悶刺痛、循環不暢", "rd": ["有些舊傷，不理它不會好，只會一直隱隱作痛。", "三七甘、微苦而溫，入肝、胃，散瘀止血、消腫定痛——既能止住流失，又能化開瘀結，是化瘀療傷的好手。", "胸悶刺痛、情緒鬱結、覺得有些舊痛還在隱隱作響，那是瘀阻沒散。", "給自己時間療傷，把淤積的慢慢化開。你會發現，那些痛正被溫柔地帶走。"]}, {"id": 35, "n": "桃仁", "la": "Prunus persica", "cat": "理氣活血類", "sub": "活血", "pr": "苦、甘，平", "me": "心、肝、大腸", "fn": "活血祛瘀、潤腸通便", "af": "我放下執著的停滯，開啟活力的循環", "mo": "「破開陳舊的堵塞。」", "yo": "活血祛瘀，打通被遺忘的通道。", "img": "taoren", "bs": "情緒鬱結、胸悶刺痛、循環不暢", "rd": ["堵久了的東西，總有一天要被推開。", "桃仁苦、甘而平，入心、肝、大腸，活血祛瘀、潤腸通便。它沉穩有力，最擅長破開那種頑固的瘀滯，讓停住的重新流通。", "情緒鬱結、胸悶刺痛、身心都堵堵的，那是瘀血阻滯、氣血不暢。堵著，人就悶、就痛。", "鼓起勇氣把陳舊的堵塞破開。卡住的一推開，生命重新流動，你會鬆一大口氣。"]}, {"id": 36, "n": "紅花", "la": "Carthamus tinctorius", "cat": "理氣活血類", "sub": "活血", "pr": "辛，溫", "me": "心、肝", "fn": "活血通經、散瘀止痛", "af": "我點燃生命的熱度，讓熱血重新沸騰", "mo": "「點燃流動的生機。」", "yo": "活血通經，讓停滯的血液再次奔流。", "img": "honghua", "bs": "情緒鬱結、胸悶刺痛、循環不暢", "rd": ["停滯久了的循環，需要一把火重新點燃。", "紅花辛、溫，入心、肝，活血通經、散瘀止痛。它溫通有力，把瘀滯化開、把冷掉的循環重新燒旺。", "情緒鬱結、胸悶刺痛、整個人有點淤住停滯，那是氣血運行不暢——生命一不流動，就容易發悶發痛。", "動一動、疏通一下。不管身體還是情緒，只要重新流起來，暖和活力就回來了。"]}, {"id": 37, "n": "益母草", "la": "Leonurus japonicus", "cat": "理氣活血類", "sub": "活血", "pr": "辛、苦，微寒", "me": "肝、心包、膀胱", "fn": "活血調經、利尿消腫", "af": "我溫柔對待自己，讓女性的慈愛滋長", "mo": "「母親般的守護。」", "yo": "活血調經，溫柔地照顧女性的身心。", "img": "yimucao", "bs": "情緒鬱結、胸悶刺痛、循環不暢", "rd": ["照顧了那麼多人，也該有人這樣照顧你。", "益母草辛、苦而微寒，入肝、心包、膀胱，活血調經、利尿消腫，一直被當作女性的守護之藥。", "情緒鬱結、身體悶脹、循環與代謝都不太順，那是氣血瘀滯、水濕停留。這種時候，你最需要的是被好好對待。", "像母親護著孩子那樣護著自己。溫柔地疏、溫柔地養，瘀一化開，身心都被療癒了。"]}, {"id": 38, "n": "川芎", "la": "Ligusticum chuanxiong", "cat": "理氣活血類", "sub": "活血", "pr": "辛，溫", "me": "肝、膽、心包", "fn": "活血行氣、祛風止痛", "af": "我的氣血暢通無阻，智慧在流動中閃耀", "mo": "「穿越阻礙的力量。」", "yo": "活血行氣，讓氣血突破所有障礙。", "img": "chuanxiong", "bs": "情緒鬱結、胸悶刺痛、循環不暢", "rd": ["卡住的感覺，其實是在提醒你：該用力突破了。", "川芎辛、溫，入肝、膽、心包，是「血中之氣藥」，既活血又行氣，能上能下、四處通行，把堵住的地方一一打通。", "情緒鬱結、頭脹胸悶、循環不暢，那是氣血瘀滯。", "相信自己穿越阻礙的力量。主動去疏、去推，氣血一通行無阻，眼前的僵局也會跟著鬆動。"]}, {"id": 39, "n": "延胡索", "la": "Corydalis yanhusuo", "cat": "理氣活血類", "sub": "活血", "pr": "辛、苦，溫", "me": "肝、脾", "fn": "活血行氣、止痛", "af": "我切斷痛苦的連結，讓平安在體內擴散", "mo": "「直達痛點的解藥。」", "yo": "活血止痛，精準化解每一處疼痛。", "img": "yanhusuo", "bs": "情緒鬱結、胸悶刺痛、循環不暢", "rd": ["痛，其實是在指出那個卡住的地方——別再繞開它了。", "延胡索辛、苦而溫，入肝、脾，是行氣活血、止痛的要藥；無論氣滯還是血瘀引起的痛，它都能直達其處。", "胸悶刺痛、情緒鬱結、身心某處隱隱作痛，那是氣血瘀阻。", "讓自己直達痛點：看清它從哪來，正視它。把根源的瘀與滯化開，痛才會真正鬆手。"]}, {"id": 40, "n": "丹參", "la": "Salvia miltiorrhiza", "cat": "理氣活血類", "sub": "活血", "pr": "苦，微寒", "me": "心、肝", "fn": "活血祛瘀、涼血消癰", "af": "我打開心靈的循環，讓愛自在地出入", "mo": "「一味抵三藥的力量。」", "yo": "活血祛瘀，全方位疏通心脈。", "img": "danshen", "bs": "情緒鬱結、胸悶刺痛、循環不暢", "rd": ["與其四處分心，不如把力氣專注在最要緊的那一味。", "丹參苦、微寒，入心、肝，活血祛瘀、涼血，古人說「一味丹參，功同四物」，補血活血的作用又全面又扎實。", "情緒鬱結、胸悶刺痛、循環不暢又帶點煩熱，那是瘀熱互結、心肝失養——這種複雜的悶，需要一份周全的疏理。", "相信專注的力量。心力放對地方，一味到位，勝過分散四方；身心也會跟著順起來。"]}, {"id": 41, "n": "枳殼", "la": "Citrus aurantium", "cat": "理氣活血類", "sub": "理氣", "pr": "苦、辛，微寒", "me": "脾、胃、大腸", "fn": "理氣寬中、行滯消脹", "af": "我放下對結果的執著，內心放鬆而通達", "mo": "「撐開壓縮的空間。」", "yo": "理氣寬中，讓被壓迫的胸腹重獲自由。", "img": "zhike", "bs": "胸悶脹氣、情緒壓抑、呼吸不暢", "rd": ["被塞得喘不過氣的時候，你需要的是一點空間。", "枳殼苦、辛而微寒，入脾、胃、大腸，理氣寬中、行滯消脹，擅長把壅住的氣往外撐、往下順，讓悶脹的地方鬆開。", "胸腹脹悶、情緒壓抑、覺得被擠得沒有餘地，那是氣機壅滯。空間不夠，人和氣都會卡。", "替自己撐開一點餘地。塞滿的行程、情緒、念頭鬆一鬆，氣順了，你才有地方好好呼吸。"]}, {"id": 42, "n": "木香", "la": "Aucklandia lappa", "cat": "理氣活血類", "sub": "理氣", "pr": "辛、苦，溫", "me": "脾、胃、大腸、膽", "fn": "行氣止痛、健脾消食", "af": "我撫平內在的緊繃，消化生命中的不安", "mo": "「讓氣息暢通無阻。」", "yo": "行氣止痛，疏通每一條受阻的經絡。", "img": "muxiang", "bs": "胸悶脹氣、情緒壓抑、呼吸不暢", "rd": ["氣一不通，人就又悶又沉又痛。", "木香辛、苦而溫，入脾、胃、大腸、膽，是行氣止痛的要藥，最擅長疏通中焦的氣滯，讓脹悶隨著氣的流動散去。", "胸腹脹悶、情緒鬱結、處處覺得堵著，那是氣滯不行。", "讓氣息重新暢通。動一動、鬆一鬆、把積壓的疏開，氣一流動，悶與痛就慢慢化了。"]}, {"id": 43, "n": "佩蘭", "la": "Eupatorium fortunei", "cat": "理氣活血類", "sub": "理氣", "pr": "辛，平", "me": "脾、胃、肺", "fn": "芳香化濕、醒脾開胃", "af": "我洗刷體內的濁氣，回歸清爽自在", "mo": "「清新喚醒沉睡的脾。」", "yo": "芳香化濕，讓混沌的身心恢復清明。", "img": "peilan", "bs": "胸悶脹氣、情緒壓抑、呼吸不暢", "rd": ["整個人黏黏膩膩、提不起勁，像被一層濕氣蓋住——需要一點清新來醒醒。", "佩蘭辛、平，入脾、胃、肺，芳香化濕、醒脾開胃，用它那股清芬把黏膩的濕濁化開，把被困住的脾胃輕輕喚醒。", "胸悶、身體沉重黏膩、食慾與精神都低落，那多半是濕濁困住了脾。", "透透氣、動一動、換個環境。濕濁一散，脾一醒，你就重新輕盈、也有胃口了。"]}, {"id": 44, "n": "陳皮", "la": "Citrus reticulata", "cat": "理氣活血類", "sub": "理氣", "pr": "苦、辛，溫", "me": "肺、脾", "fn": "理氣健脾、燥濕化痰", "af": "我讓氣機順暢流動，所有阻滯都被化解", "mo": "「疏通糾結的思緒。」", "yo": "理氣化痰，讓壓在心頭的沉悶煙消雲散。", "img": "chenpi", "bs": "胸悶脹氣、情緒壓抑、呼吸不暢", "rd": ["思緒打成一團的時候，不用硬解，一條一條理就好。", "陳皮苦、辛而溫，入肺、脾，理氣健脾、燥濕化痰，溫溫地行氣、化濕，既順了脾胃的氣，也化開黏滯的痰。", "胸悶脹氣、思緒打結、身心有點黏滯不清，那是氣滯痰阻。想不通，有時是氣和濕一起卡住了。", "慢慢把糾結的思緒疏開。氣理順了、黏滯化了，內在清爽，思路自然明朗。"]}, {"id": 45, "n": "香附", "la": "Cyperus rotundus", "cat": "理氣活血類", "sub": "理氣", "pr": "辛、微苦、微甘，平", "me": "肝、脾、三焦", "fn": "疏肝解鬱、理氣調經、止痛", "af": "我允許情緒自由流動，與身體和諧共處", "mo": "「解開情緒的鎖。」", "yo": "氣病之總司，為你推開鬱結已久的窗。", "img": "xiangfu", "bs": "胸悶脹氣、情緒壓抑、呼吸不暢", "rd": ["心裡卡著一口氣，久久吐不出來——是時候把那把鎖打開了。", "香附辛、微苦、微甘而平，入肝、脾、三焦，疏肝解鬱、理氣止痛，被稱為「氣病之總司」，最會化解那種因鬱而生的悶與痛。", "情緒壓抑、胸脅脹悶、老覺得心裡堵著，那是肝氣鬱結；鬱久了，身心都跟著繃。", "允許自己表達、允許自己放下。肝氣一舒，壓在胸口的那口悶，就輕輕散了。"]}, {"id": 46, "n": "玫瑰花", "la": "Rosa rugosa", "cat": "理氣活血類", "sub": "理氣", "pr": "甘、微苦，溫", "me": "肝、脾", "fn": "行氣解鬱、和血散瘀", "af": "我釋放壓抑的情緒，溫柔地擁抱自己", "mo": "「綻放心中的花園。」", "yo": "行氣解鬱，讓愛與美在心間流動。", "img": "meiguihua", "bs": "胸悶脹氣、情緒壓抑、呼吸不暢", "rd": ["那些一直忍著、沒說出口的情緒，該讓它們流動了。", "玫瑰花甘、微苦而溫，入肝、脾，行氣解鬱、和血散瘀。氣一鬱，人就悶；它的溫柔，正是把打結的地方一點一點鬆開。", "胸口悶悶脹脹、呼吸不太順、有種說不上來的壓抑，那多半是情緒卡住、氣機不暢。這不是矯情，是身體很誠實地替你喊了出來。", "給自己一點溫柔：深呼吸，把想說的說出來，把想哭的哭出來。心裡的花園重新透氣，愛與美才有地方流動。"]}, {"id": 47, "n": "佛手", "la": "Citrus medica var. sarcodactylis", "cat": "理氣活血類", "sub": "理氣", "pr": "辛、苦，溫", "me": "肝、脾、胃、肺", "fn": "疏肝理氣、和胃止痛、燥濕化痰", "af": "我撥開情緒的迷霧，活出自由的樣貌", "mo": "「張開接納的雙手。」", "yo": "疏肝理氣，以開放的姿態擁抱生命。", "img": "foshou", "bs": "胸悶脹氣、情緒壓抑、呼吸不暢", "rd": ["越是緊握、越是抗拒，氣就越堵。", "佛手辛、苦而溫，入肝、脾、胃、肺，疏肝理氣、和胃化痰，疏解得溫和，把鬱住的肝氣和滯悶的脾胃一起理順。", "情緒壓抑、胸悶脹氣、呼吸不太順，那是肝鬱氣滯。", "試著像佛手那樣，把手張開，接納那些你一直壓著的。放鬆了、接納了，氣息和心情都會重新舒展。"]}, {"id": 48, "n": "砂仁", "la": "Amomum villosum", "cat": "理氣活血類", "sub": "理氣", "pr": "辛，溫", "me": "脾、胃、腎", "fn": "化濕開胃、溫脾止瀉", "af": "我喚醒感官的喜悅，重新品味生活", "mo": "「開啟封閉的胃口。」", "yo": "化濕開胃，讓堵塞的消化重新運轉。", "img": "sharen", "bs": "胸悶脹氣、情緒壓抑、呼吸不暢", "rd": ["連胃口都關上了，多半是身心被一股濕悶壓著。", "砂仁辛、溫，入脾、胃、腎，化濕開胃、溫脾止瀉，芳香而溫，最擅長化開中焦的濕濁，把被濕困住的食慾喚回來。", "胸悶脹氣、沒胃口、對事情也提不起興致，那是濕阻脾胃、氣機不暢。", "把那股濕悶化掉、中焦暖一暖。脾胃一轉起來，你對食物、對生活的那點興致，也會跟著回來。"]}, {"id": 49, "n": "金銀花", "la": "Lonicera japonica", "cat": "清熱解表類", "sub": "清熱", "pr": "甘，寒", "me": "肺、心、胃", "fn": "清熱解毒、疏散風熱", "af": "我釋放所有的毒素，讓內心清涼平靜", "mo": "「以清涼化解毒熱。」", "yo": "清熱解毒，將躁動的火焰轉為平靜。", "img": "jinyinhua", "bs": "心煩易怒、口乾舌燥、焦躁不安", "rd": ["心裡積了一股散不掉的燥熱，像悶著一團火。", "金銀花甘、寒，入肺、心、胃，清熱解毒、疏散風熱，清而不峻，像一股甘涼的清泉，把鬱積的熱毒溫和地化開。", "心煩、口乾、焦躁上火，甚至覺得身心都有點「發炎」，那是熱毒內蘊——積熱不散，人就容易躁、容易累。", "讓自己降降火、靜一靜、多喝水。內在的熱一化開，你就重新清爽平和了。"]}, {"id": 50, "n": "菊花", "la": "Chrysanthemum morifolium", "cat": "清熱解表類", "sub": "清熱", "pr": "甘、苦，微寒", "me": "肺、肝", "fn": "疏風清熱、平肝明目", "af": "我放下緊繃的視線，以平和心看待世界", "mo": "「在紛擾中保持清明。」", "yo": "疏風清熱，讓過熱的頭腦冷靜下來。", "img": "juhua", "bs": "心煩易怒、口乾舌燥、焦躁不安", "rd": ["腦子燒得太熱、停不下來的時候，需要一陣涼風。", "菊花甘、苦而微寒，入肺、肝，疏風清熱、平肝明目。當肝火往上衝、思緒轉個不停，它就像一陣清涼的風，把過旺的熱氣往下帶。", "心煩易怒、口乾、坐立難安，那是內在的火有點過頭了。越急著解決，反而越亂。", "先讓自己靜下來，才看得清方向。保持清明不是壓住情緒，是讓它自然冷卻；緊繃的視線一鬆，世界就柔和了。"]}, {"id": 51, "n": "決明子", "la": "Cassia obtusifolia", "cat": "清熱解表類", "sub": "清熱", "pr": "甘、苦、鹹，微寒", "me": "肝、大腸", "fn": "清肝明目、潤腸通便", "af": "我清楚看見每個選擇，明智地做出決定", "mo": "「看清真相的勇氣。」", "yo": "清肝明目，撥開迷霧看見光明。", "img": "juemingzi", "bs": "心煩易怒、口乾舌燥、焦躁不安", "rd": ["看清真相，需要一點勇氣，也需要先把火降下來。", "決明子甘、苦、鹹而微寒，入肝、大腸，清肝明目、潤腸通便。肝火一降，眼睛和心都跟著清亮，事情也看得更透。", "心煩易怒、眼睛乾澀、內在焦躁，那是肝火偏旺——火上了頭，人容易看不清、也容易鑽牛角尖。", "帶著勇氣把肝火清一清。視線一明，你會看見那個一直被忽略的答案。"]}, {"id": 52, "n": "梔子", "la": "Gardenia jasminoides", "cat": "清熱解表類", "sub": "清熱", "pr": "苦，寒", "me": "心、肺、三焦", "fn": "瀉火除煩、清熱利濕、涼血解毒", "af": "我清走胸中的悶火，找回原本的寬廣", "mo": "「釋放心中的燥火。」", "yo": "瀉火除煩，讓焦躁的心歸於寧靜。", "img": "zhizi", "bs": "心煩易怒、口乾舌燥、焦躁不安", "rd": ["翻來覆去睡不著，是因為有一股火，悶在胸口出不去。", "梔子苦、寒，入心、肺、三焦，瀉火除煩、清熱利濕，專清那種鬱在胸中、讓人靜不下來的煩熱。", "心煩失眠、焦躁不安、胸中悶熱，那是心火內鬱——火悶在裡面，人就定不下來。", "別再硬壓那股煩躁，給它一個出口。鬱熱一清掉，心自然就安靜了。"]}, {"id": 53, "n": "生地黃", "la": "Rehmannia glutinosa (raw)", "cat": "清熱解表類", "sub": "清熱", "pr": "甘、苦，寒", "me": "心、肝、腎", "fn": "清熱涼血、養陰生津", "af": "我的陰陽調和平衡，內在清涼而滋潤", "mo": "「冷卻過熱的血液。」", "yo": "清熱涼血，讓沸騰的情緒平靜下來。", "img": "shengdihuang", "bs": "心煩易怒、口乾舌燥、焦躁不安", "rd": ["火太旺、水又不夠，人就又躁又乾。", "生地黃甘、苦而寒，入心、肝、腎，清熱涼血、養陰生津——一面替過熱的血降溫，一面把被熱耗掉的陰津補回來。", "心煩、口乾、燥熱睡不安，那是血熱夾著陰虛。", "降火的同時，別忘了補水。內在重新清涼潤澤了，焦躁會慢慢退去。"]}, {"id": 54, "n": "知母", "la": "Anemarrhena asphodeloides", "cat": "清熱解表類", "sub": "清熱", "pr": "苦、甘，寒", "me": "肺、胃、腎", "fn": "清熱瀉火、滋陰潤燥", "af": "清涼甘露滋潤我的內在，焦慮隨之平息", "mo": "「以智慧降伏虛火。」", "yo": "清熱滋陰，用理性平息內在的燃燒。", "img": "zhimu", "bs": "心煩易怒、口乾舌燥、焦躁不安", "rd": ["降伏虛火，靠的是智慧，不是蠻力。", "知母苦、甘而寒，入肺、胃、腎，清熱瀉火、滋陰潤燥，既能清實火，又能滋陰以退虛火，清與潤兼顧。", "心煩、口乾、燥熱難眠，那是陰虛火旺——這種火，不是靠壓，是靠補水滋陰來平。", "看懂焦躁背後其實是「缺水」。一面降火、一面滋養，內在就回到清涼的平衡了。"]}, {"id": 55, "n": "石膏", "la": "Gypsum Fibrosum", "cat": "清熱解表類", "sub": "清熱", "pr": "甘、辛，大寒", "me": "肺、胃", "fn": "清熱瀉火、除煩止渴", "af": "我降下憤怒的高溫，讓理智回歸平靜", "mo": "「鎮住狂奔的烈焰。」", "yo": "清熱瀉火，讓過度的熱情回歸理性。", "img": "shigao", "bs": "心煩易怒、口乾舌燥、焦躁不安", "rd": ["當一把火燒到失控，需要的不是搧風，是一塊沉甸甸、能壓住它的東西。", "石膏就是這樣的存在。甘、辛而大寒，專入肺、胃，是中醫清瀉實熱的猛將，對付的正是那種燒得又急又旺的火。", "最近煩躁到坐不住、口乾舌燥、腦子停不下來嗎？那多半是體內的熱太盛。愈想壓，愈亂。", "先讓火降下來吧（大寒之性，實際服用請遵醫囑）。等熱退了你會發現，清明本來就在，只是剛才被燒得看不見。"]}, {"id": 56, "n": "玄參", "la": "Scrophularia ningpoensis", "cat": "清熱解表類", "sub": "清熱", "pr": "甘、苦、鹹，微寒", "me": "肺、胃、腎", "fn": "清熱涼血、滋陰降火、解毒散結", "af": "我平息燃燒的火焰，展現慈悲的語言", "mo": "「深入降火，滋養根本。」", "yo": "清熱涼血，解開藏在深處的結。", "img": "xuanshen", "bs": "心煩易怒、口乾舌燥、焦躁不安", "rd": ["表面那把火，根子往往在深處的缺水。", "玄參甘、苦、鹹而微寒，入肺、胃、腎，清熱涼血、滋陰降火、解毒散結，降的是深層的虛火，一面清熱、一面補回陰液。", "口乾咽燥、心煩焦躁、內熱難消，那是陰虛火旺、虛火上炎。", "別只顧滅表面的火。把底下的陰補起來，焦躁才不會一次次回頭。"]}, {"id": 57, "n": "薄荷", "la": "Mentha haplocalyx", "cat": "清熱解表類", "sub": "解表", "pr": "辛，涼", "me": "肺、肝", "fn": "疏散風熱、疏肝解鬱", "af": "清新的風掠過心靈，我的思緒通透清明", "mo": "「一陣清風吹散鬱悶。」", "yo": "疏散風熱，讓窒悶的心胸豁然開朗。", "img": "bohe", "bs": "身體僵硬、畏風怕冷、頭痛不適", "rd": ["悶在心頭的那股鬱，需要一陣清風吹散。", "薄荷辛、涼，入肺、肝，疏散風熱、疏肝解鬱，清涼輕揚，既能散頭面的風熱，也能鬆開鬱住的肝氣。", "頭脹、身體緊繃、心情悶悶的，那是風熱夾著肝鬱——悶在裡面，人就沉、就僵。", "去吹吹風、透透氣。鬱悶被輕輕吹散，頭清爽了，心也跟著亮起來。"]}, {"id": 58, "n": "桑葉", "la": "Morus alba", "cat": "清熱解表類", "sub": "解表", "pr": "甘、苦，寒", "me": "肺、肝", "fn": "疏散風熱、清肺潤燥", "af": "我疏散外在的燥熱，恢復內在的清明", "mo": "「輕柔地疏散燥熱。」", "yo": "疏散風熱，如秋葉般帶走多餘的火氣。", "img": "sangye", "bs": "身體僵硬、畏風怕冷、頭痛不適", "rd": ["有些燥熱，用輕柔化解，比硬碰更有效。", "桑葉甘、苦而寒，入肺、肝，疏散風熱、清肺潤燥，清得溫和，一面散表面的風熱，一面潤養被燥氣傷到的肺。", "頭脹、眼乾、身體緊繃又帶點燥，那是風熱夾著燥邪。", "不必用力對抗。清潤並行，表面的熱散了、裡頭被潤了，你就重新清爽了。"]}, {"id": 59, "n": "柴胡", "la": "Bupleurum chinense", "cat": "清熱解表類", "sub": "解表", "pr": "苦、辛，微寒", "me": "肝、膽、肺", "fn": "疏散退熱、疏肝解鬱、升舉陽氣", "af": "我在起伏中找到平衡，推開心窗見陽光", "mo": "「升起被壓抑的能量。」", "yo": "疏肝解鬱，讓下沉的氣機重新上揚。", "img": "chaihu", "bs": "身體僵硬、畏風怕冷、頭痛不適", "rd": ["被壓得太久的能量，是時候升起來了。", "柴胡苦、辛而微寒，入肝、膽、肺，疏肝解鬱、升舉陽氣，既能疏散鬱結，又能把下陷、低落的氣往上提。", "情緒低落壓抑、身體發緊、提不起勁，那是肝氣鬱結、清陽不升——被壓久了，人就沉、就悶。", "把鬱結疏開、把低落的氣提起來。內在重新往上走，你會覺得整個人被撐開、變輕了。"]}, {"id": 60, "n": "生薑", "la": "Zingiber officinale", "cat": "清熱解表類", "sub": "解表", "pr": "辛，微溫", "me": "肺、脾、胃", "fn": "解表散寒、溫中止嘔、化痰止咳", "af": "我擁抱生命的暖意，驅散所有寒冷與不安", "mo": "「第一道溫暖的防線。」", "yo": "解表散寒，在寒意入侵時及時驅散。", "img": "shengjiang", "bs": "身體僵硬、畏風怕冷、頭痛不適", "rd": ["著涼的時候，第一件事是給自己一點溫暖。", "生薑辛、微溫，入肺、脾、胃，解表散寒、溫中止嘔，是驅散初起風寒的日常良伴，暖胃、散寒，也安撫翻湧的不適。", "怕風怕冷、身體發緊、有點著涼想不舒服，那是風寒剛襲上來。", "築起第一道溫暖的防線吧。一碗薑湯、一份保暖，把寒擋在外頭，身心就踏實安穩許多。"]}, {"id": 61, "n": "茯苓", "la": "Poria cocos", "cat": "化濕消導類", "sub": "利水滲濕", "pr": "甘、淡，平", "me": "心、脾、腎", "fn": "利水滲濕、健脾安神", "af": "我釋放不再需要的重擔，心靈安定如山", "mo": "「排出多餘的負擔。」", "yo": "利水滲濕，讓身心都變得輕盈。", "img": "fuling", "bs": "身體沉重、浮腫疲倦、頭腦昏沉", "rd": ["是時候，把那些多餘的、沉重的東西，溫和地放下了。", "茯苓甘、淡而平，入心、脾、腎，利水滲濕、健脾安神。它不猛不烈，像默默把體內多餘的濕、把心裡多餘的負擔，慢慢排掉的那種力量。", "身體沉重、容易浮腫疲倦、頭腦昏昏沉沉，那是「濕」滯住了，氣血運行變慢——這時你要的不是更用力，是讓身心重新流動。", "清理一些不再需要的重擔吧：事情、關係、或心裡的執念。多餘的排掉了，你會輕盈得多，也安定得多。"]}, {"id": 62, "n": "薏苡仁", "la": "Coix lacryma-jobi", "cat": "化濕消導類", "sub": "利水滲濕", "pr": "甘、淡，微寒", "me": "脾、胃、肺", "fn": "利水滲濕、健脾止瀉、清熱排膿", "af": "我清除所有積壓，恢復輕盈自在的狀態", "mo": "「淨化內在的濁氣。」", "yo": "利水滲濕，還給身體清爽的環境。", "img": "yiyiren", "bs": "身體沉重、浮腫疲倦、頭腦昏沉", "rd": ["人一重、一懶，多半是濁氣積太多了。", "薏苡仁甘、淡而微寒，入脾、胃、肺，利水滲濕、健脾，清利卻不峻，把體內多餘的濕濁溫和地排出去。", "身體沉重、浮腫疲倦、頭腦昏沉，那是濕濁停滯、脾運不暢。", "清一清吧——飲食、環境，還有心裡的雜念。濕濁一排掉，整個人就清透、輕盈了。"]}, {"id": 63, "n": "桔梗", "la": "Platycodon grandiflorus", "cat": "化濕消導類", "sub": "化痰止咳", "pr": "苦、辛，平", "me": "肺", "fn": "宣肺祛痰、利咽排膿", "af": "我打開表達的通道，聲音清晰有力", "mo": "「開啟表達的通道。」", "yo": "宣肺祛痰，讓壓抑的聲音得以釋放。", "img": "jiegeng", "bs": "胸悶痰多、呼吸不暢、表達受阻", "rd": ["有話卡在喉頭說不出來，氣和情都會跟著堵。", "桔梗苦、辛而平，入肺，宣肺祛痰、利咽，還被當作「載藥上行」的舟楫，最會宣開肺氣、通利咽喉。", "胸悶痰多、呼吸不暢、想說的說不出口，那是肺氣不宣。", "把那條表達的通道打開。宣一宣肺、清一清喉，把想說的說出來——氣通了、話通了，胸口自然就鬆了。"]}, {"id": 64, "n": "杏仁", "la": "Prunus armeniaca", "cat": "化濕消導類", "sub": "化痰止咳", "pr": "苦，溫（有小毒）", "me": "肺、大腸", "fn": "止咳平喘、潤腸通便", "af": "我順暢地排解情緒，讓氣息回歸自然", "mo": "「潤滑生命的呼吸。」", "yo": "止咳平喘，讓每一次呼吸都順暢自如。", "img": "xingren", "bs": "胸悶痰多、呼吸不暢、表達受阻", "rd": ["一呼一吸若卡卡的，人就跟著緊。", "杏仁苦、溫（有小毒，服用宜遵醫囑），入肺、大腸，止咳平喘、潤腸通便，降氣潤肺，把上逆、乾澀的氣機往下順、往潤裡帶。", "胸悶、呼吸不暢、身心有點乾澀卡頓，那是肺氣上逆、失於宣降。", "把呼吸放慢、放柔，讓一呼一吸都順下來。氣機一宣降有序，緊繃就隨著吐納鬆開了。"]}, {"id": 65, "n": "貝母", "la": "Fritillaria cirrhosa", "cat": "化濕消導類", "sub": "化痰止咳", "pr": "苦、甘，微寒", "me": "肺、心", "fn": "清熱潤肺、化痰止咳", "af": "我散去心中的凝結，讓哀傷轉化為力量", "mo": "「化開心肺的痰結。」", "yo": "清熱化痰，讓黏稠的鬱悶消散無蹤。", "img": "beimu", "bs": "胸悶痰多、呼吸不暢、表達受阻", "rd": ["心口那團化不開的悶，往往是痰結。", "貝母苦、甘而微寒，入肺、心，清熱潤肺、化痰止咳，清潤並行，把黏稠、鬱熱的痰結溫和地化開。", "胸悶痰多、呼吸不暢、心裡也悶著散不掉，那是痰熱鬱結——痰一結，氣不順、情也堵。", "清一清、潤一潤，把鬱著的疏開。痰與悶一散，呼吸和心情都清朗了。"]}, {"id": 66, "n": "神曲", "la": "Massa Medicata Fermentata", "cat": "化濕消導類", "sub": "消食", "pr": "甘、辛，溫", "me": "脾、胃", "fn": "消食和胃、健脾進食", "af": "我給予自己足夠空間，轉化所有經驗", "mo": "「發酵出新的可能。」", "yo": "消食和胃，將積壓的負擔轉化為養分。", "img": "shenqu", "bs": "腹脹不適、食慾不振、消化停滯", "rd": ["舊的不消化掉，新的就發酵不出來。", "神曲由多物發酵而成，甘、辛而溫，入脾、胃，消食和胃、健脾，最擅長化解積滯，讓停住的重新運轉。", "腹脹、食慾不振、消化停滯，那是食積、脾胃運化不動——積著不消，人就悶、就重。", "把舊的、積著的先消化掉，騰出空間。新的可能，才有機會慢慢醞釀。"]}, {"id": 67, "n": "萊菔子", "la": "Raphanus sativus", "cat": "化濕消導類", "sub": "消食", "pr": "辛、甘，平", "me": "肺、脾、胃", "fn": "消食除脹、降氣化痰", "af": "我順暢地排解壓力，讓心靈恢復舒坦", "mo": "「順勢而下的釋放。」", "yo": "消食降氣，讓上衝的濁氣找到出口。", "img": "laifuzi", "bs": "腹脹不適、食慾不振、消化停滯", "rd": ["憋著不放，只會更脹；有時候，順勢往下就好。", "萊菔子辛、甘而平，入肺、脾、胃，消食除脹、降氣化痰，擅長把上逆壅滯的氣往下順，把脹悶和痰一起帶走。", "腹脹、噯氣、消化停滯又覺得氣往上頂，那是食積氣滯。", "別硬憋。該排的排、該放的放，氣一往下順，脹悶自然就消了。"]}, {"id": 68, "n": "雞內金", "la": "Gallus gallus domesticus", "cat": "化濕消導類", "sub": "消食", "pr": "甘，平", "me": "脾、胃、小腸、膀胱", "fn": "健胃消食、固精止遺", "af": "我軟化內心的硬塊，讓能量自由流動", "mo": "「磨碎所有的硬塊。」", "yo": "健胃消食，再堅硬的積滯也能化解。", "img": "jineijin", "bs": "腹脹不適、食慾不振、消化停滯", "rd": ["再硬的積塊，也能一點一點磨化開。", "雞內金甘、平，入脾、胃、小腸、膀胱，是消食化積的良藥，連頑固的積滯都磨得動，消食的力道很足。", "腹脹、食慾差、消化停滯像塞了塊東西，那是積滯不化——硬塊卡著，運轉就停。", "有耐心地磨。不管是胃裡的積，還是心裡的結，一點一點化，終會磨得順暢通透。"]}, {"id": 69, "n": "山楂", "la": "Crataegus pinnatifida", "cat": "化濕消導類", "sub": "消食", "pr": "酸、甘，微溫", "me": "脾、胃、肝", "fn": "消食化積、行氣散瘀", "af": "我消化所有積累的負擔，輕盈邁向未來", "mo": "「消化昨天的負擔。」", "yo": "消食散瘀，別讓過去的沉重擋住明天的胃口。", "img": "shanzha", "bs": "腹脹不適、食慾不振、消化停滯", "rd": ["消化不掉昨天，就走不動今天。", "山楂酸、甘而微溫，入脾、胃、肝，消食化積、行氣散瘀，尤其擅長化開油膩肉食的積滯。", "腹脹、消化停滯、心裡也堆著些化不開的事，那是積滯未消——舊的不清，新的進不來。", "好好消化昨天的負擔：積著的食、積著的情，都化一化。清空了，你才有餘裕迎接新的一天。"]}, {"id": 70, "n": "麥芽", "la": "Hordeum vulgare", "cat": "化濕消導類", "sub": "消食", "pr": "甘，平", "me": "脾、胃、肝", "fn": "消食健胃、回乳消脹", "af": "我尊重成長的節奏，享受當下的過程", "mo": "「萌發新生的力量。」", "yo": "消食健胃，如種子破土般消化停滯。", "img": "maiya", "bs": "腹脹不適、食慾不振、消化停滯", "rd": ["消化與放下之後，才輪到新芽冒頭。", "麥芽是發芽的大麥，甘、平，入脾、胃、肝，消食健胃、消脹，一面化積消脹，一面帶著種子萌芽般的生發之氣。", "腹脹、食慾不振、消化停滯，那是食積脾滯——積著不動，生機也跟著停。", "把積滯化開、脾胃喚醒。阻滯一通，新的生機就像嫩芽那樣，一點一點冒出來。"]}, {"id": 71, "n": "琥珀", "la": "Succinum", "cat": "安神收澀類", "sub": "安神", "pr": "甘，平", "me": "心、肝、小腸、膀胱", "fn": "鎮驚安神、散瘀止血、利水通淋", "af": "我找回靈魂的家園，內在平安無懼", "mo": "「凝固的時光帶來寧靜。」", "yo": "鎮驚安神，讓千萬年的沉澱守護你。", "img": "hupo", "bs": "心神不寧、失眠多夢、驚悸不安", "rd": ["讓時間慢下來，紛亂的心才有地方安放。", "琥珀是千萬年凝結成的樹脂，甘、平，入心、肝、小腸、膀胱，鎮驚安神，沉而定，最能把受驚、浮動的心神穩穩鎮住。", "心神不寧、失眠多夢、容易驚悸，那是心神失守、定不下來——心一亂，連睡都不安穩。", "放慢腳步、沉澱下來。浮動的心一被安放，那份踏實的平靜就回來了。"]}, {"id": 72, "n": "酸棗仁", "la": "Ziziphus jujuba var. spinosa", "cat": "安神收澀類", "sub": "安神", "pr": "甘、酸，平", "me": "心、肝、膽", "fn": "養心補肝、寧心安神、斂汗", "af": "我的心神安寧，輕鬆進入修復的深眠", "mo": "「在溫暖中入眠。」", "yo": "養心益肝，為受驚的心蓋上一條安穩的被子。", "img": "suanzaoren", "bs": "心神不寧、失眠多夢、驚悸不安", "rd": ["你的心累了，它在跟你討一場好眠。", "酸棗仁甘、酸而平，入心、肝、膽，是安神助眠的常用藥，養心補肝、寧心安神。它的溫柔在於「收」——把那顆四處飄、靜不下來的心，慢慢收攏回來。", "心神不寧、翻來覆去睡不好、多夢易驚，那是心血與肝血養不住神了。不是你想太多，是你的心真的需要休息與滋養。", "今晚，給自己一個安穩的睡前儀式。讓緊繃鬆開，替受驚的心蓋上一條被子——你可以放心地沉沉睡去。"]}, {"id": 73, "n": "天麻", "la": "Gastrodia elata", "cat": "安神收澀類", "sub": "平肝息風", "pr": "甘，平", "me": "肝", "fn": "息風止痙、平抑肝陽", "af": "我穩住內在的重心，找回平衡的方位", "mo": "「在搖晃中找到平衡。」", "yo": "息風止痙，讓動盪的內心穩定下來。", "img": "tianma", "bs": "頭暈目眩、情緒波動、肝火上炎", "rd": ["天旋地轉、站不太穩的時候，需要找回重心。", "天麻甘、平，入肝，是平肝息風的要藥，最擅長平抑上亢的肝陽，安定那種頭暈目眩、天旋地轉的失衡。", "頭暈目眩、情緒起伏大、覺得站不穩，那是肝陽上亢、內風擾動——晃動，是失衡的訊號。", "把上衝的能量按下來，重心放回中央。內風一平息，你就重新站得穩、看得清了。"]}, {"id": 74, "n": "牡蠣", "la": "Ostrea gigas", "cat": "安神收澀類", "sub": "平肝息風", "pr": "鹹，微寒", "me": "肝、膽、腎", "fn": "重鎮安神、平肝潛陽", "af": "我軟化內心的堅硬，讓心神沉潛回歸", "mo": "「收斂浮動的心神。」", "yo": "重鎮安神，讓飄蕩的靈魂沉入安穩。", "img": "muli", "bs": "頭暈目眩、情緒波動、肝火上炎", "rd": ["心浮起來的時候，需要一枚鎮石把它壓回去。", "牡蠣鹹、微寒，入肝、膽、腎，重鎮安神、平肝潛陽，質重性沉，像一枚鎮石，把上浮飄散的陽氣與心神潛降下來。", "頭暈、心浮氣躁、情緒容易被牽動，那是肝陽上浮、心神不潛——浮在上面，人就晃、就不安。", "讓自己沉下來、靜下來、往內收。浮陽一潛降，你就重新有了安穩的重量。"]}, {"id": 75, "n": "鉤藤", "la": "Uncaria rhynchophylla", "cat": "安神收澀類", "sub": "平肝息風", "pr": "甘，涼", "me": "肝、心包", "fn": "息風定驚、清熱平肝", "af": "我放鬆臉部與心靈，平息焦躁的神經", "mo": "「平息腦海的風暴。」", "yo": "清熱息風，讓紛亂的思緒在鉤尖定格平靜。", "img": "gouteng", "bs": "頭暈目眩、情緒波動、肝火上炎", "rd": ["腦海裡那場停不下來的風暴，是時候讓它平息了。", "鉤藤甘、涼，入肝、心包，息風定驚、清熱平肝，清涼柔和，最會平息肝風、鎮定那種躁動不安的內在騷動。", "頭暈脹、心煩躁動、思緒像風暴般停不住，那是肝風內動、肝火偏旺——腦子太亢，人就靜不了。", "讓過亢的能量降下來、思緒慢下來。內在的風一停，你就回到一片清明與安定。"]}, {"id": 76, "n": "地龍", "la": "Pheretima aspergillum", "cat": "安神收澀類", "sub": "平肝息風", "pr": "鹹，寒", "me": "肝、脾、膀胱", "fn": "清熱定驚、通絡、平喘、利尿", "af": "我通達全身的經絡，與萬物重新連結", "mo": "「從地底傳來的安定。」", "yo": "清熱定驚，用大地的沉穩平息風暴。", "img": "dilong", "bs": "頭暈目眩、情緒波動、肝火上炎", "rd": ["上面太熱、下面又堵的時候，需要回到大地般的沉穩。", "地龍鹹、寒，入肝、脾、膀胱，清熱定驚、通經活絡，性沉走下，一面清熱定驚，一面把不通的經絡疏開。", "頭暈目眩、情緒波動大、肝火上炎、身體緊繃不通，那是熱擾夾著經絡阻滯。", "把上炎的火往下清、把不通的疏開。能量重新接地了，你就沉穩，也通暢了。"]}, {"id": 77, "n": "五味子", "la": "Schisandra chinensis", "cat": "安神收澀類", "sub": "收澀", "pr": "酸、甘，溫", "me": "肺、心、腎", "fn": "收斂固澀、益氣生津、補腎寧心", "af": "我收攝散逸的能量，找回完整的自我", "mo": "「守住完整的自己。」", "yo": "五味具全，才是生命最真實且飽滿的樣子。", "img": "wuweizi", "bs": "精力渙散、容易流失、缺乏持續力", "rd": ["漏得太多，再多的能量也留不住。", "五味子五味俱全、以酸為主而溫，入肺、心、腎，收斂固澀、益氣生津，最擅長「收」——把耗散的氣、津、神一併收攝回來。", "精力渙散、容易疲乏、覺得能量一直在流失，那是氣陰耗散、收攝無力。", "守住完整的自己。減少無謂的消耗，把心力收回內在。散逸的一聚攏，你就重新飽滿了。"]}, {"id": 78, "n": "蓮子", "la": "Nelumbo nucifera (seed)", "cat": "安神收澀類", "sub": "收澀", "pr": "甘、澀，平", "me": "脾、腎、心", "fn": "補脾止瀉、益腎止遺、養心安神", "af": "我的心如蓮花般安穩，守護內在的純淨", "mo": "「在淤泥中保持純淨。」", "yo": "補脾養心，讓心如蓮花般出淤泥而不染。", "img": "lianzi", "bs": "精力渙散、容易流失、缺乏持續力", "rd": ["出淤泥而不染，說的是一種守得住自己的力量。", "蓮子甘、澀而平，入脾、腎、心，補脾止瀉、益腎固精、養心安神，一面收澀固守，一面安養那顆容易慌的心。", "精力渙散、心神不寧、覺得能量與定力都在流失，那是脾腎不固、心神失養——守不住，人就慌。", "守住自己的核心與界線，不被外境帶走。內在一安穩，你自然出淤泥而不染。"]}, {"id": 79, "n": "芡實", "la": "Euryale ferox", "cat": "安神收澀類", "sub": "收澀", "pr": "甘、澀，平", "me": "脾、腎", "fn": "益腎固精、補脾止瀉", "af": "我的生命根基堅實，在穩定中獲得滋養", "mo": "「收住流失的精華。」", "yo": "益腎固精，守護身體最珍貴的能量。", "img": "qianshi", "bs": "精力渙散、容易流失、缺乏持續力", "rd": ["珍貴的東西正在漏走，得及時把它收住。", "芡實甘、澀而平，入脾、腎，益腎固精、補脾止瀉，收澀之力扎實，最會固守身體最根本的能量。", "精力渙散、容易疲累、覺得底氣一直在漏，那是脾腎不固——存不住，再多也留不下。", "把根本守好，把能量留在該在的地方。不再無謂耗漏了，你就重新踏實有底。"]}, {"id": 80, "n": "烏梅", "la": "Prunus mume", "cat": "安神收澀類", "sub": "收澀", "pr": "酸、澀，平", "me": "肝、脾、肺、大腸", "fn": "斂肺止咳、澀腸止瀉、安蛔", "af": "我找回內在的平衡，優雅地收斂鋒芒", "mo": "「接納生命中的酸甜。」", "yo": "收斂固澀，酸澀過後的甘甜最能生津止渴。", "img": "wumei", "bs": "精力渙散、容易流失、缺乏持續力", "rd": ["酸澀過後的那點回甘，往往最解渴。", "烏梅酸、澀而平，入肝、脾、肺、大腸，斂肺澀腸、生津，以酸收之性把外散的收回，也在酸澀之後生出津液與回甘。", "精力渙散、容易流失、缺乏持續的定力，那是耗散無收——一味外放，人就乾、就空。", "收斂鋒芒，沉澱自己。接納生命裡的酸與甜，你會嚐到那份收斂之後的回甘。"]}, {"id": 81, "n": "山茱萸", "la": "Cornus officinalis", "cat": "安神收澀類", "sub": "收澀", "pr": "酸、澀，微溫", "me": "肝、腎", "fn": "補益肝腎、收斂固脫", "af": "我的能量飽滿固守，不再輕易流失", "mo": "「把握住滑落的力量。」", "yo": "補益肝腎，在流失前及時收斂。", "img": "shanzhuyu", "bs": "精力渙散、容易流失、缺乏持續力", "rd": ["力量正在滑落的時候，要及時伸手把它握住。", "山茱萸酸、澀而微溫，入肝、腎，補益肝腎、收斂固脫，既能補又能收，最會在能量將散未散之際，穩穩地固攝住。", "精力渙散、腰膝無力、覺得元氣一點點滑走，那是肝腎不足、固攝無力。", "補一補根本、收一收心神。該固守的被穩穩握住了，你就重新充盈而穩固。"]}];
