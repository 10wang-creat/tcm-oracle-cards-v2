<script>
var H=[{"id": 1, "n": "肉桂", "la": "Cinnamomum cassia", "cat": "補益類", "sub": "溫裡", "pr": "辛、甘，大熱", "me": "腎、脾、心、肝", "fn": "補火助陽、引火歸元", "af": "我內在的火焰明亮，溫暖照亮我的路", "mo": "「點燃心中的小火爐。」", "yo": "引火歸元，把焦慮轉化為溫暖心窩的能量。", "img": "rougui", "bs": "身體寒冷、手腳冰涼、精神不振", "rd": ["抽到肉桂，是提醒你：內在的火需要重新被點亮了。", "肉桂性味辛、甘而大熱，入腎、脾、心、肝，是中醫溫補陽氣的要藥，擅長補火助陽、引火歸元——把飄散在外的虛火，帶回它該待的地方，從根本暖起來。", "如果你最近手腳冰涼、身體發寒、提不起精神，那是陽氣不足、核心的火太弱了。你需要的不是更多刺激，而是一份深沉而穩定的溫暖。", "允許自己回到中心，點燃心中那座小火爐。當根本暖了，身體與心都會重新有力量。"]}, {"id": 2, "n": "乾薑", "la": "Zingiber officinale (dried)", "cat": "補益類", "sub": "溫裡", "pr": "辛，熱", "me": "脾、胃、腎、心、肺", "fn": "溫中散寒、回陽通脈、溫肺化飲", "af": "溫暖的能量融化寒冰，感受重新流動", "mo": "「從核心溫暖起來。」", "yo": "溫中散寒，讓冰封的內在重新流動。", "img": "ganjiang", "bs": "身體寒冷、手腳冰涼、精神不振", "rd": ["抽到乾薑，是身體在說：該從最裡面把自己暖回來了。", "乾薑性味辛、熱，入脾、胃、腎、心、肺，中醫用它溫中散寒、回陽通脈。它的暖直接而扎實，像替受寒的核心生了一盆火，讓凍住的地方重新流動。", "如果你最近覺得身體發冷、手腳冰、做什麼都懶洋洋，那是體內的寒氣困住了生機。這時比起硬撐，更需要的是溫暖與休息。", "從核心暖起來，不急不徐。當中焦的火重新亮起，血脈自然通，精神也會跟著回來。"]}, {"id": 3, "n": "丁香", "la": "Syzygium aromaticum", "cat": "補益類", "sub": "溫裡", "pr": "辛，溫", "me": "脾、胃、腎", "fn": "溫中降逆、補腎助陽", "af": "我接受生命的一切，順應自然的氣息", "mo": "「芬芳中的溫暖。」", "yo": "溫中降逆，用香氣化解胃中的寒涼翻騰。", "img": "dingxiang", "bs": "身體寒冷、手腳冰涼、精神不振", "rd": ["抽到丁香，是提醒你：溫暖不一定要轟烈，也可以很細緻。", "丁香性味辛、溫，入脾、胃、腎，中醫用它溫中降逆、補腎助陽。它像一縷帶著香氣的暖流，把往上翻湧的不適安撫下來，也悄悄替腎中的陽氣添柴。", "如果你最近身體怕冷、精神不振，或胃裡總覺得悶悶想逆，那是中焦有寒、氣機不順。你需要一點溫柔而確實的暖意。", "讓自己在芬芳中安定下來。細水長流的溫暖，往往比一時的熱烈更能滋養你。"]}, {"id": 4, "n": "小茴香", "la": "Foeniculum vulgare", "cat": "補益類", "sub": "溫裡", "pr": "辛，溫", "me": "肝、腎、脾、胃", "fn": "散寒止痛、理氣和胃", "af": "我的情緒自由流動，寒意在溫柔中解開", "mo": "「溫柔解開糾結。」", "yo": "散寒止痛，讓緊縮的腹中恢復舒展。", "img": "xiaohuixiang", "bs": "身體寒冷、手腳冰涼、精神不振", "rd": ["抽到小茴香，是提醒你：那些因寒而糾結、緊縮的地方，可以慢慢鬆開了。", "小茴香性味辛、溫，入肝、腎、脾、胃，中醫用它散寒止痛、理氣和胃。寒一散、氣一順，原本抽痛打結的地方，就會像被暖手輕輕按過般舒展開來。", "如果你最近身體發冷、小腹或身側悶脹抽緊、提不起勁，那多半是寒氣夾著氣滯卡住了。緊繃需要的不是用力，是溫度。", "給自己一點溫暖與耐心，溫柔地解開心裡與身體的糾結。鬆了，就順了。"]}, {"id": 5, "n": "吳茱萸", "la": "Evodia rutaecarpa", "cat": "補益類", "sub": "溫裡", "pr": "辛、苦，熱", "me": "肝、脾、胃、腎", "fn": "散寒止痛、降逆止嘔、助陽止瀉", "af": "我平息內在的混亂，讓平靜重新降臨", "mo": "「驅散深處的寒意。」", "yo": "散寒止痛，將藏在角落的寒氣一掃而空。", "img": "wuzhuyu", "bs": "身體寒冷、手腳冰涼、精神不振", "rd": ["抽到吳茱萸，是提醒你：有些寒意藏得很深，該正視、也該驅散了。", "吳茱萸性味辛、苦而熱，入肝、脾、胃、腎，中醫用它散寒止痛、降逆止嘔。它的力道直達深處，專門對付那種頑固、盤踞在裡面的寒。", "如果你最近特別畏寒、身體冷痛、連情緒都跟著低沉，那是深層的寒困住了你。這種冷，需要更堅定的溫暖去化解。", "別輕忽那股深處的寒意。給自己足夠的暖與休息，把它一點一點驅散，你會重新感到踏實。"]}, {"id": 6, "n": "人參", "la": "Panax ginseng", "cat": "補益類", "sub": "補氣", "pr": "甘、微苦，微溫", "me": "脾、肺、心、腎", "fn": "大補元氣、安神益智", "af": "我的內在力量源源不絕，我值得被滋養", "mo": "「大補元氣，重啟核心。」", "yo": "當你感到空虛時，記得找回最原始的力量。", "img": "renshen", "bs": "疲倦乏力、氣短懶言、精神不濟", "rd": ["抽到人參,是身心在提醒你:你已經透支太久了,是時候把力氣補回來。", "人參性味甘、微苦而微溫,入脾、肺、心、腎四經,是中醫「大補元氣」的代表。元氣是你最核心、最根本的那股生命力;人參擅長的,就是從最深處重新為你點火。", "如果你最近容易疲倦乏力、話都懶得說、做什麼都提不起勁,這不是你不夠努力,而是核心的能量真的空了。身體不是要你再撐,是要你停下來,被好好滋養。", "允許自己好好休息、好好吃飯。你值得被照顧。當核心重新充滿,力量自然會源源不絕地回來。"]}, {"id": 7, "n": "黃耆", "la": "Astragalus membranaceus", "cat": "補益類", "sub": "補氣", "pr": "甘，微溫", "me": "脾、肺", "fn": "益氣固表、利尿托毒", "af": "我有堅固的能量屏障，保護我不受侵擾", "mo": "「為自己築起護城河。」", "yo": "補足了氣，外在的紛擾就再也傷不了你。", "img": "huangqi", "bs": "疲倦乏力、氣短懶言、精神不濟", "rd": ["抽到黃耆，是提醒你：在付出之前，先把自己的防線築牢。", "黃耆性味甘、微溫，入脾、肺，中醫用它益氣固表——補足中氣，也在體表撐起一層保護，讓你不那麼容易被消耗與外邪侵擾。", "如果你最近容易累、動不動就虛、稍微一忙就撐不住，那是氣虛、表不固的訊號。你不是不夠強，是把自己守得太少。", "為自己築一道護城河吧。先把氣補足、把界線立好，你才有餘力去照顧別人與世界。"]}, {"id": 8, "n": "紅棗", "la": "Ziziphus jujuba", "cat": "補益類", "sub": "補氣", "pr": "甘，溫", "me": "脾、胃", "fn": "補中益氣、養血安神", "af": "我被溫柔包圍，內心感到安穩與滿足", "mo": "「給生活一點紅潤。」", "yo": "脾胃安穩了，心情也會跟著甜美起來。", "img": "hongzao", "bs": "疲倦乏力、氣短懶言、精神不濟", "rd": ["抽到紅棗，是提醒你：日子需要一點甜、一點紅潤的暖意。", "紅棗性味甘、溫，入脾、胃，中醫用它補中益氣、養血安神。它溫和而家常，像一碗熱湯，默默把氣血補起來，也把慌亂的心安下來。", "如果你最近臉色不好、容易累、心也定不太下來，那是中氣與血不足了。這種時候，樸實的滋養最有力量。", "給生活一點紅潤：好好吃飯、好好睡覺、對自己溫柔一點。平凡的照顧，會慢慢把你養回來。"]}, {"id": 9, "n": "山藥", "la": "Dioscorea opposita", "cat": "補益類", "sub": "補氣", "pr": "甘，平", "me": "脾、肺、腎", "fn": "補脾養胃、生津益肺", "af": "我能從容轉化生命經驗，成為成長養分", "mo": "「不溫不火的滋養。」", "yo": "最好的補給，是潤物無聲地融入日常。", "img": "shanyao", "bs": "疲倦乏力、氣短懶言、精神不濟", "rd": ["抽到山藥，是提醒你：滋養不必猛烈，溫和持續才走得遠。", "山藥性味甘、平，入脾、肺、腎，中醫用它補脾養胃、生津益肺。它不寒不熱、平和中正，像默默墊在底下的地基，一點一點把三處補起來。", "如果你最近容易疲倦、氣力不足、腸胃也偏弱，那是脾氣虛的表現。你需要的不是急補，是細水長流的照顧。", "用不溫不火的方式對待自己：規律、溫和、不勉強。穩穩地養，根基才會真正扎實。"]}, {"id": 10, "n": "靈芝", "la": "Ganoderma lucidum", "cat": "補益類", "sub": "補氣", "pr": "甘，平", "me": "心、肺、肝、腎", "fn": "補氣安神、止咳平喘", "af": "我與宇宙的智慧相連，內在平和而覺醒", "mo": "「與天地同呼吸。」", "yo": "補氣安神，開啟身心與宇宙的智慧連結。", "img": "lingzhi", "bs": "疲倦乏力、氣短懶言、精神不濟", "rd": ["抽到靈芝，是提醒你：回到一種與天地同步的、安穩的節奏。", "靈芝性味甘、平，入心、肺、肝、腎，中醫用它補氣安神。它補得深、也補得靜，一面添氣力，一面把浮動的心神安定下來。", "如果你最近身心俱疲、睡不安穩、連呼吸都覺得淺，那是氣不足、神不寧。你需要讓自己慢下來，重新對準內在的節奏。", "深呼吸，與天地同一個呼吸。當氣足神安，你會找回那份沉靜而綿長的力量。"]}, {"id": 11, "n": "黨參", "la": "Codonopsis pilosula", "cat": "補益類", "sub": "補氣", "pr": "甘，平", "me": "脾、肺", "fn": "健脾益肺、養血生津", "af": "我以穩定的步伐前進，力量持續累積", "mo": "「每一天的日常，都值得細心補給。」", "yo": "平凡的積累，終能成就脾胃的底氣。", "img": "dangshen", "bs": "疲倦乏力、氣短懶言、精神不濟", "rd": ["抽到黨參，是提醒你：別小看日常的補給，力量都是一天天累積的。", "黨參性味甘、平，入脾、肺，中醫常用它健脾益肺、養血生津，是溫和版的補氣良藥。它不猛，貴在平穩，適合天天慢慢地把氣血補回來。", "如果你最近總覺得沒力、話懶得說、精神差，那是脾肺氣虛。與其等到透支才急救，不如每天給自己一點溫和的滋養。", "每一天的日常，都值得被細心對待。好好吃、好好休息，平穩地補，你會一天比一天有底氣。"]}, {"id": 12, "n": "白朮", "la": "Atractylodes macrocephala", "cat": "補益類", "sub": "補氣", "pr": "苦、甘，溫", "me": "脾、胃", "fn": "健脾益氣、燥濕利水、止汗安胎", "af": "我的內在井然有序，清明而穩定", "mo": "「排解心中的濕重。」", "yo": "健脾化濕，讓沉重的心情恢復清爽。", "img": "baizhu", "bs": "疲倦乏力、氣短懶言、精神不濟", "rd": ["抽到白朮，是提醒你：把脾胃顧好，也把心裡那股沉重濕悶排掉。", "白朮性味苦、甘而溫，入脾、胃，中醫用它健脾益氣、燥濕利水。它一面補脾氣，一面把滯留的濕氣化開，讓身體不再又累又重。", "如果你最近疲倦乏力、身體發沉、頭腦也昏昏的，那是脾虛生濕。這種重，補與化要一起來。", "顧好中焦，也清理心裡的濕重。當脾氣足、濕氣散，你會覺得整個人乾爽、輕盈起來。"]}, {"id": 13, "n": "西洋參", "la": "Panax quinquefolius", "cat": "補益類", "sub": "補氣", "pr": "甘、微苦，涼", "me": "心、肺、腎", "fn": "補氣養陰、清熱生津", "af": "我以清涼的方式滋養自己，恢復平靜", "mo": "「在冷靜中補給。」", "yo": "不需要燥進，也能在平和中養出滿滿的元氣。", "img": "xiyangshen", "bs": "疲倦乏力、氣短懶言、精神不濟", "rd": ["抽到西洋參，是提醒你：補力氣的同時，也要為自己降降火、留住水分。", "西洋參性味甘、微苦而涼，入心、肺、腎，中醫用它補氣養陰、清熱生津。它和人參不同，補氣卻不助火，適合又累又帶點燥熱的你。", "如果你最近疲倦卻又心煩口乾、越忙越上火，那是氣陰兩虛。這種時候，一味涼潤的補，比燥熱的猛補更合適。", "在冷靜中補給自己：補氣，也補水；做事，也留白。氣陰同養，你才不會越補越燥。"]}, {"id": 14, "n": "甘草", "la": "Glycyrrhiza uralensis", "cat": "補益類", "sub": "補氣", "pr": "甘，平", "me": "心、肺、脾、胃", "fn": "補脾益氣、清熱解毒", "af": "我調和內外的一切，在圓滿中獲得自在", "mo": "「與世界達成和解。」", "yo": "調和諸藥的力量，是讓一切矛盾都化為圓滿。", "img": "gancao", "bs": "疲倦乏力、氣短懶言、精神不濟", "rd": ["抽到甘草，是提醒你：試著調和，而不是對抗。", "甘草性味甘、平，入心、肺、脾、胃，中醫用它補脾益氣、清熱解毒，更被稱為藥中的「和事佬」——能調和各種藥性，讓彼此衝突的力量重新協調。", "如果你最近身心疲累、內在有股拉扯與不和，那是需要被緩和、被調解的訊號。有時鬆一口氣，比硬碰硬更有力量。", "與世界、也與自己達成和解吧。當內在重新協調，緊繃會鬆開，力量會回流。"]}, {"id": 15, "n": "當歸", "la": "Angelica sinensis", "cat": "補益類", "sub": "補血", "pr": "甘、辛，溫", "me": "肝、心、脾", "fn": "補血活血、調經止痛", "af": "愛的能量在我體內流動，滋養每個細胞", "mo": "「讓愛流動，適時回歸。」", "yo": "活血補血，讓心底凝滯的委屈重新流動。", "img": "danggui", "bs": "面色蒼白、心悸失眠、情感空虛", "rd": ["抽到當歸，是提醒你：讓血、也讓愛重新流動，並適時回到自己身邊。", "當歸性味甘、辛而溫，入肝、心、脾，是中醫補血的代表藥，既能補血又能活血。它把不足的補起來、把瘀滯的推開，讓生命之流重新溫暖地循環。", "如果你最近臉色蒼白、心悸失眠、心裡有種空空的匱乏感，那是血虛養不住神與情。你需要被滋養，也需要把耗散在外的自己收回來。", "讓愛流動，也記得回歸。「當歸」二字本就是「應當歸來」——先把自己補滿，愛才有源頭。"]}, {"id": 16, "n": "桂圓", "la": "Dimocarpus longan", "cat": "補益類", "sub": "補血", "pr": "甘，溫", "me": "心、脾", "fn": "補心安神、養血益脾", "af": "我的心安住當下，寧靜而圓滿", "mo": "「圓滿自己的心房。」", "yo": "補心安神，讓不安的靈魂找到溫暖歸宿。", "img": "guiyuan", "bs": "面色蒼白、心悸失眠、情感空虛", "rd": ["抽到桂圓，是提醒你：先把自己的心房填滿，再談圓滿。", "桂圓性味甘、溫，入心、脾，中醫用它補心安神、養血益脾。它甜潤溫暖，一面補養心血，一面安撫那顆容易慌、容易空的心。", "如果你最近心悸、睡不安穩、覺得情感上有點空落，那是心脾兩虛、心血不足。這種空，要用溫暖的滋養慢慢填。", "圓滿自己的心房：允許被愛，也好好愛自己。當心血充盈，你會由內而外地安定、飽滿。"]}, {"id": 17, "n": "制何首烏", "la": "Polygonum multiflorum (processed)", "cat": "補益類", "sub": "補血", "pr": "苦、甘、澀，微溫", "me": "肝、腎", "fn": "補肝腎、益精血、烏鬚髮", "af": "我擁抱生命的每個階段，智慧與活力並存", "mo": "「留住美好的光澤。」", "yo": "由內而外的滋養，能讓時光在髮間停留。", "img": "zhiheshouwu", "bs": "面色蒼白、心悸失眠、情感空虛", "rd": ["抽到制何首烏，是提醒你：好好滋養根本，才能留住那份由內而外的光澤。", "制何首烏性味苦、甘、澀而微溫，入肝、腎，中醫用它補肝腎、益精血。它補的是深層的精血——身體最根本的儲備，充足了，人自然有神采。", "如果你最近臉色黯淡、容易累、覺得像被掏空，那是精血不足的訊號。表面的憔悴，往往來自根本的虧損。", "從根本養起，別急著追求外在。當肝腎精血飽滿，那份美好的光澤會自己回到你身上。"]}, {"id": 18, "n": "阿膠", "la": "Equus asinus (Colla Corii Asini)", "cat": "補益類", "sub": "補血", "pr": "甘，平", "me": "肺、肝、腎", "fn": "補血滋陰、潤燥止血", "af": "我的生命如甘泉湧流，充滿滋潤與甜美", "mo": "「修補心靈的裂痕。」", "yo": "滋陰補血，為疲憊的靈魂覆蓋一層保護膜。", "img": "ejiao", "bs": "面色蒼白、心悸失眠、情感空虛", "rd": ["抽到阿膠，是提醒你：那些內在的耗損與裂痕，是時候好好修補了。", "阿膠性味甘、平，入肺、肝、腎，是中醫補血滋陰的名藥，擅長把虧損的血與陰一點一點補回、把乾裂的地方潤養起來。", "如果你最近臉色蒼白、心悸失眠、覺得身心都有點乾涸空虛，那是血虛陰虧。這種損耗，需要沉靜而滋潤的修復。", "給自己時間修補心靈的裂痕。不必急著完好，慢慢滋養，裂縫也會長出新的溫柔。"]}, {"id": 19, "n": "白芍", "la": "Paeonia lactiflora", "cat": "補益類", "sub": "補血", "pr": "苦、酸，微寒", "me": "肝、脾", "fn": "養血調經、斂陰止汗", "af": "我的內在柔軟有彈性，優雅地面對壓力", "mo": "「溫柔地擁抱情緒。」", "yo": "柔肝止痛，讓緊繃的身體在愛中放鬆。", "img": "baishao", "bs": "面色蒼白、心悸失眠、情感空虛", "rd": ["抽到白芍，是提醒你：用溫柔去擁抱情緒，而不是壓抑它。", "白芍性味苦、酸而微寒，入肝、脾，中醫用它養血斂陰、柔肝止痛。它擅長「柔肝」——把緊繃剛硬的肝氣，養得柔軟而有彈性。", "如果你最近情緒緊繃、容易煩、臉色也不太好，那是肝血不足、肝氣失柔。越硬撐，越容易繃斷。", "溫柔地擁抱自己的情緒吧。當內在被血養得柔潤，你會發現自己能屈能伸，不再那麼容易受傷。"]}, {"id": 20, "n": "枸杞子", "la": "Lycium barbarum", "cat": "補益類", "sub": "補陰", "pr": "甘，平", "me": "肝、腎", "fn": "滋補肝腎、益精明目", "af": "我以清澈的雙眼看見生命中的美好", "mo": "「用清澈的眼看世界。」", "yo": "滋補肝腎，讓你的視野永遠明亮溫柔。", "img": "gouqizi", "bs": "口乾舌燥、心煩失眠、內熱焦躁", "rd": ["抽到枸杞子，是提醒你：滋養肝腎，也擦亮你看世界的那雙眼。", "枸杞子性味甘、平，入肝、腎，中醫用它滋補肝腎、益精明目。中醫說「肝開竅於目」，肝腎的精血足了，眼睛與心神都會跟著清亮。", "如果你最近眼睛乾澀、容易累、心也有點煩躁，那是肝腎陰精不足。看不清，有時是因為裡面的水養不夠。", "好好滋養自己，用一雙清澈的眼重新看世界。當根本被補足，你會看得更亮、也更溫柔。"]}, {"id": 21, "n": "熟地黃", "la": "Rehmannia glutinosa (processed)", "cat": "補益類", "sub": "補陰", "pr": "甘，微溫", "me": "肝、腎", "fn": "滋陰補血、益精填髓", "af": "我深深扎根於大地，內在充實而穩固", "mo": "「在深度中紮根。」", "yo": "滋陰填髓，在安靜中補足最深層的生命力。", "img": "shudihuang", "bs": "口乾舌燥、心煩失眠、內熱焦躁", "rd": ["抽到熟地黃，是提醒你：向下扎根，把最深層的自己補滿。", "熟地黃性味甘、微溫，入肝、腎，是中醫滋陰補血、益精填髓的厚重之藥。它補得很深，直達根本的精髓，是那種替你重新蓄滿底氣的力量。", "如果你最近覺得被掏空、腰膝無力、心煩難眠，那是陰血與精髓虧虛。浮在表面的忙碌，往往掏的是最深的存底。", "在深度中紮根。慢下來，把根本養厚，你才撐得起向上的一切。"]}, {"id": 22, "n": "天門冬", "la": "Asparagus cochinchinensis", "cat": "補益類", "sub": "補陰", "pr": "甘、苦，寒", "me": "肺、腎", "fn": "養陰潤燥、清肺生津", "af": "我平息燥熱的情緒，恢復冰清般的冷靜", "mo": "「在乾涸中保持清涼。」", "yo": "養陰潤燥，即使烈日當空也能保持內心清潤。", "img": "tianmendong", "bs": "口乾舌燥、心煩失眠、內熱焦躁", "rd": ["抽到天門冬，是提醒你：在燥熱之中，替自己保留一份清涼與滋潤。", "天門冬性味甘、苦而寒，入肺、腎，中醫用它養陰潤燥、清肺生津。它清中帶潤，一面降虛火，一面把乾涸的津液補回來。", "如果你最近口乾舌燥、心煩、夜裡睡不安，那是肺腎陰虛、虛火上擾。這種乾與燥，要靠滋潤來解，而不是硬壓。", "在乾涸中保持清涼。給自己足夠的水與靜，當陰液回來，內在的燥熱自然會平息。"]}, {"id": 23, "n": "百合", "la": "Lilium brownii", "cat": "補益類", "sub": "補陰", "pr": "甘，微寒", "me": "心、肺", "fn": "養陰潤肺、清心安神", "af": "我的心如百合般純淨，在寧靜中綻放", "mo": "「純淨的心，自有力量。」", "yo": "養陰潤肺，讓心靈如百合般澄澈安寧。", "img": "baihe", "bs": "口乾舌燥、心煩失眠、內熱焦躁", "rd": ["抽到百合,是提醒你「慢下來、向內收」的時刻。", "百合性味甘、微寒,入心、肺二經,中醫用它養陰潤肺、清心安神。白話說,就是為那些想太多、燒得太快而乾涸煩躁的身心,重新注入一份清涼與滋潤。", "如果你最近覺得口乾舌燥、心煩、難以入睡,或內在有股說不出的燥熱,這是心肺陰液被耗損的訊號。百合想告訴你:你不需要再用力,只要靜靜地把自己補回來。", "讓心像百合一樣,在寧靜中慢慢綻放。純淨,本身就是一種力量。"]}, {"id": 24, "n": "麥門冬", "la": "Ophiopogon japonicus", "cat": "補益類", "sub": "補陰", "pr": "甘、微苦，微寒", "me": "心、肺、胃", "fn": "養陰生津、潤肺清心", "af": "我以甘潤滋養心田，讓清涼泉水流過", "mo": "「滋潤每一寸乾涸。」", "yo": "養陰生津，為枯竭的心田注入清泉。", "img": "maimendong", "bs": "口乾舌燥、心煩失眠、內熱焦躁", "rd": ["抽到麥門冬，是提醒你：去滋潤那些被燒得乾乾的角落。", "麥門冬性味甘、微苦而微寒，入心、肺、胃，中醫用它養陰生津、潤肺清心。它像一泓甘涼的泉，把心、肺、胃裡的乾與熱一寸寸潤開。", "如果你最近口乾、心煩、睡不好、內在有股焦躁，那是陰津不足、心肺失潤。越焦躁越乾，越乾越焦躁。", "允許自己被滋潤：多喝水、多留白、少燃燒。當每一寸乾涸重新濕潤，心也會跟著清涼安定。"]}, {"id": 25, "n": "玉竹", "la": "Polygonatum odoratum", "cat": "補益類", "sub": "補陰", "pr": "甘，微寒", "me": "肺、胃", "fn": "養陰潤燥、生津止渴", "af": "我找回內在的潤澤，重新連結美的感知", "mo": "「柔韌地穿越乾旱。」", "yo": "養陰潤燥，溫柔而持久地滋養生命。", "img": "yuzhu", "bs": "口乾舌燥、心煩失眠、內熱焦躁", "rd": ["抽到玉竹，是提醒你：以柔韌而非硬撐，穿越眼前這段乾旱。", "玉竹性味甘、微寒，入肺、胃，中醫用它養陰潤燥、生津止渴。它滋潤卻不滯膩，補得溫和，像替乾裂的土地慢慢注入水分。", "如果你最近口乾、燥熱、心煩失眠，那是肺胃陰虛、津液不足。乾旱的時候，更需要溫柔而持續的滋養。", "柔韌地穿越乾旱。不必用力對抗，把自己潤養得有彈性，你就能安然走過這段乾燥的時期。"]}, {"id": 26, "n": "冬蟲夏草", "la": "Cordyceps sinensis", "cat": "補益類", "sub": "補陽", "pr": "甘，平", "me": "肺、腎", "fn": "補肺益腎、止血化痰", "af": "我在蛻變中更加完整，生命不斷更新", "mo": "「跨越季節的等待。」", "yo": "在沉默中蛻變，只為補足生命最深刻的氣。", "img": "dongchongxiacao", "bs": "畏寒怕冷、腰膝酸軟、動力不足", "rd": ["抽到冬蟲夏草，是提醒你：有些力量，是在等待與轉化中慢慢長成的。", "冬蟲夏草性味甘、平，入肺、腎，中醫用它補肺益腎。它平補陰陽、不燥不烈，像歷經寒冬與盛夏才成形的存在，補得緩、也補得穩。", "如果你最近畏寒、腰膝酸軟、提不起勁，那是肺腎兩虛、根本的能量弱了。這種虛，急不得，要靠時間慢慢養。", "跨越季節的等待吧。給自己足夠的時間與滋養，力量會在你不催促的時候，悄悄長回來。"]}, {"id": 27, "n": "續斷", "la": "Dipsacus asperoides", "cat": "補益類", "sub": "補陽", "pr": "苦、辛，微溫", "me": "肝、腎", "fn": "補肝腎、強筋骨、續折傷", "af": "我溫柔撫平傷痛，讓勇氣重新連結", "mo": "「連結斷點，重新出發。」", "yo": "續筋接骨，受過的傷會讓你變得更強壯。", "img": "xuduan", "bs": "畏寒怕冷、腰膝酸軟、動力不足", "rd": ["抽到續斷，是提醒你：那些斷掉的、中止的，都有機會重新接上。", "續斷性味苦、辛而微溫，入肝、腎，中醫用它補肝腎、強筋骨、續折傷。光看名字就知道，它擅長把斷開的地方重新連結、把受損的筋骨補起來。", "如果你最近腰膝酸軟、身體虛冷、覺得動力斷了線，那是肝腎不足、筋骨失養。斷點不是終點，是待接之處。", "連結斷點，重新出發。把根本補回來，那些以為斷了的，會以更堅韌的方式接續下去。"]}, {"id": 28, "n": "補骨脂", "la": "Psoralea corylifolia", "cat": "補益類", "sub": "補陽", "pr": "辛、苦，溫", "me": "腎、脾", "fn": "補腎壯陽、固精縮尿", "af": "我點燃內在的火種，照亮前行的道路", "mo": "「重建生命的骨架。」", "yo": "補腎壯陽，讓動搖的根基再次穩固。", "img": "buguzhi", "bs": "畏寒怕冷、腰膝酸軟、動力不足", "rd": ["抽到補骨脂，是提醒你：是時候把生命的骨架重新立穩了。", "補骨脂性味辛、苦而溫，入腎、脾，中醫用它補腎壯陽、固精縮尿。它溫補下焦的根本陽氣，像替搖晃的地基重新打樁。", "如果你最近畏寒、腰膝無力、精神提不起來，那是腎陽不足、根基不穩。撐不住，常是因為底下的骨架鬆了。", "從根本重建你的骨架。把腎陽補穩，你會重新站得直、走得穩，也更有向前的動力。"]}, {"id": 29, "n": "淫羊藿", "la": "Epimedium brevicornu", "cat": "補益類", "sub": "補陽", "pr": "辛、甘，溫", "me": "肝、腎", "fn": "補腎陽、強筋骨、祛風濕", "af": "我擁抱生命的熱情，展現強大的生命力", "mo": "「喚醒沉睡的熱情。」", "yo": "補腎陽強筋骨，重燃生命的火焰。", "img": "yinyanghuo", "bs": "畏寒怕冷、腰膝酸軟、動力不足", "rd": ["抽到淫羊藿，是提醒你：那份沉睡的熱情與活力，可以被喚醒了。", "淫羊藿性味辛、甘而溫，入肝、腎，中醫用它補腎陽、強筋骨。它溫暖而振奮，擅長把低沉的陽氣重新提振起來。", "如果你最近畏寒、腰膝酸軟、對什麼都提不起勁，那是腎陽不足、生命力偏弱。冷淡與無力，常是陽氣沉睡的樣子。", "溫柔地喚醒內在的熱情。把陽氣補起來，你會重新感到暖、感到動力，對生活也重新有了興致。"]}, {"id": 30, "n": "肉蓯蓉", "la": "Cistanche deserticola", "cat": "補益類", "sub": "補陽", "pr": "甘、鹹，溫", "me": "腎、大腸", "fn": "補腎陽、益精血、潤腸通便", "af": "我恢復流暢的步調，讓生活充滿潤澤", "mo": "「沙漠中的生命力。」", "yo": "補腎益精，在貧瘠中依然綻放力量。", "img": "roucongrong", "bs": "畏寒怕冷、腰膝酸軟、動力不足", "rd": ["抽到肉蓯蓉，是提醒你：即使處在荒涼裡，生命力依然可以被滋養。", "肉蓯蓉性味甘、鹹而溫，入腎、大腸，中醫用它補腎陽、益精血。它溫潤而不燥，補陽的同時又能潤養，像沙漠裡依然頑強生長的植物。", "如果你最近畏寒、腰膝無力、身心都有點乾枯疲乏，那是腎陽與精血不足。這種枯，要用溫潤的方式來補。", "相信沙漠中也有生命力。溫和地滋養自己，你會在看似荒涼的時期，長出意想不到的生機。"]}, {"id": 31, "n": "杜仲", "la": "Eucommia ulmoides", "cat": "補益類", "sub": "補陽", "pr": "甘，溫", "me": "肝、腎", "fn": "補肝腎、強筋骨、安胎", "af": "我的意志堅韌強健，能承載生命的目標", "mo": "「韌性，是斷不了的連結。」", "yo": "強筋壯骨，內在的絲線能撐起受傷的你。", "img": "duzhong", "bs": "畏寒怕冷、腰膝酸軟、動力不足", "rd": ["抽到杜仲，是提醒你：真正的力量，是斷不了的韌性。", "杜仲性味甘、溫，入肝、腎，中醫用它補肝腎、強筋骨。它補得溫和而扎實，專門強健支撐身體的筋骨與腰膝。", "如果你最近腰膝酸軟、身體發冷、覺得撐不太住，那是肝腎不足、筋骨失養。撐不住，是需要被補強的訊號。", "培養一種斷不了的韌性。把根本補穩，你會像杜仲的絲一樣——柔軟，卻怎麼也扯不斷。"]}, {"id": 32, "n": "鹿茸", "la": "Cervus nippon (Cornu Cervi Pantotrichum)", "cat": "補益類", "sub": "補陽", "pr": "甘、鹹，溫", "me": "腎、肝", "fn": "壯腎陽、益精血、強筋骨", "af": "我承接金色的能量，展現自信與尊貴", "mo": "「蓬勃向上的生長力。」", "yo": "壯腎陽益精血，如春日鹿角般充滿生機。", "img": "lurong", "bs": "畏寒怕冷、腰膝酸軟、動力不足", "rd": ["抽到鹿茸，是提醒你：內在有一股蓬勃向上的生長力，正等著被喚起。", "鹿茸性味甘、鹹而溫，入腎、肝，是中醫大補腎陽、益精血的峻補之藥。它力道充沛，像春天鹿角初生時那股向上猛長的生機。", "如果你最近特別畏寒、腰膝無力、整個人像洩了氣，那是腎陽與精血大虛。這種深層的虛，需要有力的溫補來扶起。", "喚起那股蓬勃向上的力量。把根本補足（峻補之品宜遵醫囑），你會重新感到生機盎然、向上生長。"]}, {"id": 33, "n": "牛膝", "la": "Achyranthes bidentata", "cat": "理氣活血類", "sub": "活血", "pr": "苦、甘、酸，平", "me": "肝、腎", "fn": "逐瘀通經、補肝腎、引血下行", "af": "我將能量平穩下沉，腳踏實地感受大地", "mo": "「引導能量向下扎根。」", "yo": "引血下行，讓上衝的躁動回歸穩定。", "img": "niuxi", "bs": "情緒鬱結、胸悶刺痛、循環不暢", "rd": ["抽到牛膝，是提醒你：把上衝的能量往下引，回到地面、回到根。", "牛膝性味苦、甘、酸而平，入肝、腎，中醫用它逐瘀通經、補肝腎，還能「引血下行」——把往上浮、往上衝的氣血，溫和地帶回下方。", "如果你最近情緒鬱結、頭重胸悶、循環不暢，那是氣血瘀滯又上浮。想得太多、火氣太上頭，身體會替你喊卡。", "引導能量向下扎根。把注意力放回身體、放回當下，當氣血下沉、瘀滯化開，你會重新踏實、安定。"]}, {"id": 34, "n": "三七", "la": "Panax notoginseng", "cat": "理氣活血類", "sub": "活血", "pr": "甘、微苦，溫", "me": "肝、胃", "fn": "散瘀止血、消腫定痛", "af": "我化解深層的瘀結，迎來全新的生命", "mo": "「止住傷口，化解舊痛。」", "yo": "散瘀止血，讓創傷不再是負擔。", "img": "sanqi", "bs": "情緒鬱結、胸悶刺痛、循環不暢", "rd": ["抽到三七，是提醒你：是時候止住傷口、慢慢化解那些舊痛了。", "三七性味甘、微苦而溫，入肝、胃，中醫用它散瘀止血、消腫定痛，既能止住流失，又能化開瘀結，是化瘀療傷的良藥。", "如果你最近胸悶刺痛、情緒鬱結、覺得有些舊傷還隱隱作痛，那是瘀阻未散。沒化開的痛，會一直卡在那裡。", "止住傷口，也化解舊痛。給自己時間療傷，把淤積的慢慢散開，你會發現痛正在被溫柔地帶走。"]}, {"id": 35, "n": "桃仁", "la": "Prunus persica", "cat": "理氣活血類", "sub": "活血", "pr": "苦、甘，平", "me": "心、肝、大腸", "fn": "活血祛瘀、潤腸通便", "af": "我放下執著的停滯，開啟活力的循環", "mo": "「破開陳舊的堵塞。」", "yo": "活血祛瘀，打通被遺忘的通道。", "img": "taoren", "bs": "情緒鬱結、胸悶刺痛、循環不暢", "rd": ["抽到桃仁，是提醒你：那些陳舊的堵塞，可以被破開、被推動了。", "桃仁性味苦、甘而平，入心、肝、大腸，中醫用它活血祛瘀、潤腸通便。它力量沉穩，擅長破開頑固的瘀滯，讓停滯的重新流通。", "如果你最近情緒鬱結、胸悶刺痛、身心都覺得堵堵的，那是瘀血阻滯、氣血不暢。堵久了，人就悶、就痛。", "鼓起勇氣破開陳舊的堵塞。把卡住的推開，讓生命重新流動，你會鬆一大口氣。"]}, {"id": 36, "n": "紅花", "la": "Carthamus tinctorius", "cat": "理氣活血類", "sub": "活血", "pr": "辛，溫", "me": "心、肝", "fn": "活血通經、散瘀止痛", "af": "我點燃生命的熱度，讓熱血重新沸騰", "mo": "「點燃流動的生機。」", "yo": "活血通經，讓停滯的血液再次奔流。", "img": "honghua", "bs": "情緒鬱結、胸悶刺痛、循環不暢", "rd": ["抽到紅花，是提醒你：讓停滯的循環，重新燃起流動的生機。", "紅花性味辛、溫，入心、肝，中醫用它活血通經、散瘀止痛。它溫通有力，擅長把瘀滯化開、把冷卻的循環重新點燃。", "如果你最近情緒鬱結、胸悶刺痛、覺得整個人有點淤住、停滯，那是氣血運行不暢。生命一旦不流動，就容易發悶發痛。", "點燃流動的生機。動一動、疏通一下，無論身體或情緒，只要重新流動起來，暖與活力就會回來。"]}, {"id": 37, "n": "益母草", "la": "Leonurus japonicus", "cat": "理氣活血類", "sub": "活血", "pr": "辛、苦，微寒", "me": "肝、心包、膀胱", "fn": "活血調經、利尿消腫", "af": "我溫柔對待自己，讓女性的慈愛滋長", "mo": "「母親般的守護。」", "yo": "活血調經，溫柔地照顧女性的身心。", "img": "yimucao", "bs": "情緒鬱結、胸悶刺痛、循環不暢", "rd": ["抽到益母草，是提醒你：用一份母親般的溫柔，守護自己的身心。", "益母草性味辛、苦而微寒，入肝、心包、膀胱，中醫常用它活血調經、利尿消腫，尤其被視為女性的守護之藥。", "如果你最近情緒鬱結、身體悶脹、循環與代謝都不太順，那是氣血瘀滯、水濕停留。這種時候，你最需要的是被好好照顧。", "像母親守護孩子那樣守護自己。溫柔地疏通、溫柔地照料，當瘀滯化開，身心都會被療癒。"]}, {"id": 38, "n": "川芎", "la": "Ligusticum chuanxiong", "cat": "理氣活血類", "sub": "活血", "pr": "辛，溫", "me": "肝、膽、心包", "fn": "活血行氣、祛風止痛", "af": "我的氣血暢通無阻，智慧在流動中閃耀", "mo": "「穿越阻礙的力量。」", "yo": "活血行氣，讓氣血突破所有障礙。", "img": "chuanxiong", "bs": "情緒鬱結、胸悶刺痛、循環不暢", "rd": ["抽到川芎，是提醒你：你有穿越阻礙、突破僵局的力量。", "川芎性味辛、溫，入肝、膽、心包，是中醫「血中之氣藥」，既活血又行氣，擅長上行下達、四處通行，把堵住的地方一一打通。", "如果你最近情緒鬱結、頭脹胸悶、循環不暢，那是氣血瘀滯。卡住的感覺，是在提醒你需要動能去突破。", "相信自己穿越阻礙的力量。主動去疏通、去推進，當氣血通行無阻，眼前的僵局也會跟著鬆動。"]}, {"id": 39, "n": "延胡索", "la": "Corydalis yanhusuo", "cat": "理氣活血類", "sub": "活血", "pr": "辛、苦，溫", "me": "肝、脾", "fn": "活血行氣、止痛", "af": "我切斷痛苦的連結，讓平安在體內擴散", "mo": "「直達痛點的解藥。」", "yo": "活血止痛，精準化解每一處疼痛。", "img": "yanhusuo", "bs": "情緒鬱結、胸悶刺痛、循環不暢", "rd": ["抽到延胡索，是提醒你：別再繞開痛點，直接面對它，才是解法。", "延胡索性味辛、苦而溫，入肝、脾，是中醫行氣活血、止痛的要藥，無論氣滯還是血瘀引起的痛，它都能直達其處。", "如果你最近胸悶刺痛、情緒鬱結、身心某處隱隱作痛，那是氣血瘀阻。痛，其實是在指出卡住的位置。", "讓自己直達痛點。看清痛從哪來、正視它，把根源的瘀與滯化開，痛才會真正被解開。"]}, {"id": 40, "n": "丹參", "la": "Salvia miltiorrhiza", "cat": "理氣活血類", "sub": "活血", "pr": "苦，微寒", "me": "心、肝", "fn": "活血祛瘀、涼血消癰", "af": "我打開心靈的循環，讓愛自在地出入", "mo": "「一味抵三藥的力量。」", "yo": "活血祛瘀，全方位疏通心脈。", "img": "danshen", "bs": "情緒鬱結、胸悶刺痛、循環不暢", "rd": ["抽到丹參，是提醒你：專注做好核心那件事，一份力量就能抵得過三份。", "丹參性味苦、微寒，入心、肝，中醫用它活血祛瘀、涼血，素有「一味丹參，功同四物」之說，補血活血的作用全面而扎實。", "如果你最近情緒鬱結、胸悶刺痛、循環不暢又帶點煩熱，那是瘀熱互結、心肝失養。這種複雜的悶，需要一份周全的疏理。", "相信專注的力量。把心力放在最關鍵之處，一味到位，勝過四處分散——身心都會因此重新順暢。"]}, {"id": 41, "n": "枳殼", "la": "Citrus aurantium", "cat": "理氣活血類", "sub": "理氣", "pr": "苦、辛，微寒", "me": "脾、胃、大腸", "fn": "理氣寬中、行滯消脹", "af": "我放下對結果的執著，內心放鬆而通達", "mo": "「撐開壓縮的空間。」", "yo": "理氣寬中，讓被壓迫的胸腹重獲自由。", "img": "zhike", "bs": "胸悶脹氣、情緒壓抑、呼吸不暢", "rd": ["抽到枳殼，是提醒你：替被壓縮得喘不過氣的自己，撐開一點空間。", "枳殼性味苦、辛而微寒，入脾、胃、大腸，中醫用它理氣寬中、行滯消脹。它擅長把壅塞的氣往外撐、往下順，讓悶脹的地方鬆開。", "如果你最近胸腹脹悶、情緒壓抑、覺得被擠得沒有餘地，那是氣機壅滯。空間不夠，人與氣都會卡住。", "為自己撐開一點空間。把塞滿的行程、情緒與念頭鬆一鬆，當氣順了，你才有地方好好呼吸。"]}, {"id": 42, "n": "木香", "la": "Aucklandia lappa", "cat": "理氣活血類", "sub": "理氣", "pr": "辛、苦，溫", "me": "脾、胃、大腸、膽", "fn": "行氣止痛、健脾消食", "af": "我撫平內在的緊繃，消化生命中的不安", "mo": "「讓氣息暢通無阻。」", "yo": "行氣止痛，疏通每一條受阻的經絡。", "img": "muxiang", "bs": "胸悶脹氣、情緒壓抑、呼吸不暢", "rd": ["抽到木香，是提醒你：讓卡住的氣息重新暢通無阻。", "木香性味辛、苦而溫，入脾、胃、大腸、膽，是中醫行氣止痛的要藥，擅長疏通中焦的氣滯，讓脹悶與疼痛隨著氣的流動而消解。", "如果你最近胸腹脹悶、情緒鬱結、覺得處處堵著，那是氣滯不行。氣一不通，人就悶、就痛、就沉。", "讓氣息暢通無阻。動一動、鬆一鬆、把積壓的疏理開，當氣重新流動，悶與痛都會慢慢化去。"]}, {"id": 43, "n": "佩蘭", "la": "Eupatorium fortunei", "cat": "理氣活血類", "sub": "理氣", "pr": "辛，平", "me": "脾、胃、肺", "fn": "芳香化濕、醒脾開胃", "af": "我洗刷體內的濁氣，回歸清爽自在", "mo": "「清新喚醒沉睡的脾。」", "yo": "芳香化濕，讓混沌的身心恢復清明。", "img": "peilan", "bs": "胸悶脹氣、情緒壓抑、呼吸不暢", "rd": ["抽到佩蘭，是提醒你：用一點清新，喚醒昏沉、提不起勁的自己。", "佩蘭性味辛、平，入脾、胃、肺，中醫用它芳香化濕、醒脾開胃。它以清芬之氣化開黏膩的濕濁，把被濕困住的脾胃輕輕喚醒。", "如果你最近胸悶、身體黏膩沉重、食慾與精神都低落，那是濕濁困脾。悶悶提不起勁，常是被濕氣壓住了。", "給自己一點清新的醒覺：透透氣、動一動、換個環境。當濕濁散去，脾一醒，你會重新輕盈有胃口。"]}, {"id": 44, "n": "陳皮", "la": "Citrus reticulata", "cat": "理氣活血類", "sub": "理氣", "pr": "苦、辛，溫", "me": "肺、脾", "fn": "理氣健脾、燥濕化痰", "af": "我讓氣機順暢流動，所有阻滯都被化解", "mo": "「疏通糾結的思緒。」", "yo": "理氣化痰，讓壓在心頭的沉悶煙消雲散。", "img": "chenpi", "bs": "胸悶脹氣、情緒壓抑、呼吸不暢", "rd": ["抽到陳皮，是提醒你：把糾結纏繞的思緒，一條條疏理開。", "陳皮性味苦、辛而溫，入肺、脾，中醫用它理氣健脾、燥濕化痰。它溫和地行氣、化濕，既順了脾胃之氣，也化開黏滯的痰濕。", "如果你最近胸悶脹氣、思緒打結、身心有點黏滯不清，那是氣滯痰阻。想不通，有時是氣與濕一起卡住了。", "慢慢疏通糾結的思緒。把積壓的氣理順、把黏滯的化開，當內在清爽了，思路也會跟著明朗。"]}, {"id": 45, "n": "香附", "la": "Cyperus rotundus", "cat": "理氣活血類", "sub": "理氣", "pr": "辛、微苦、微甘，平", "me": "肝、脾、三焦", "fn": "疏肝解鬱、理氣調經、止痛", "af": "我允許情緒自由流動，與身體和諧共處", "mo": "「解開情緒的鎖。」", "yo": "氣病之總司，為你推開鬱結已久的窗。", "img": "xiangfu", "bs": "胸悶脹氣、情緒壓抑、呼吸不暢", "rd": ["抽到香附，是提醒你：那把鎖住情緒的鎖，可以解開了。", "香附性味辛、微苦、微甘而平，入肝、脾、三焦，是中醫疏肝解鬱、理氣的要藥，被稱為「氣病之總司」，最擅長化解因鬱而生的悶與痛。", "如果你最近情緒壓抑、胸脅脹悶、常覺得心裡卡著一口氣，那是肝氣鬱結。鬱久了，身心都會跟著緊繃。", "解開情緒的那把鎖。允許自己表達、允許自己放下，當肝氣一舒，壓在胸口的悶會輕輕散去。"]}, {"id": 46, "n": "玫瑰花", "la": "Rosa rugosa", "cat": "理氣活血類", "sub": "理氣", "pr": "甘、微苦，溫", "me": "肝、脾", "fn": "行氣解鬱、和血散瘀", "af": "我釋放壓抑的情緒，溫柔地擁抱自己", "mo": "「綻放心中的花園。」", "yo": "行氣解鬱，讓愛與美在心間流動。", "img": "meiguihua", "bs": "胸悶脹氣、情緒壓抑、呼吸不暢", "rd": ["抽到玫瑰花,是心在輕聲說:那些一直忍著、沒說出口的情緒,該讓它們流動了。", "玫瑰花性味甘、微苦而溫,入肝、脾二經,中醫用它行氣解鬱、和血散瘀。氣一鬱住,人就悶;玫瑰的溫柔,正是幫你把打結的地方一點一點鬆開。", "如果你最近覺得胸口悶悶脹脹、呼吸不太順,或有種說不上來的壓抑感,那多半是情緒卡住、氣機不暢。這不是矯情,是身體很誠實地替你喊了出來。", "給自己一點溫柔:深呼吸,把想說的說出來,把想哭的哭出來。當心裡的花園重新透氣,愛與美才有空間流動。"]}, {"id": 47, "n": "佛手", "la": "Citrus medica var. sarcodactylis", "cat": "理氣活血類", "sub": "理氣", "pr": "辛、苦，溫", "me": "肝、脾、胃、肺", "fn": "疏肝理氣、和胃止痛、燥濕化痰", "af": "我撥開情緒的迷霧，活出自由的樣貌", "mo": "「張開接納的雙手。」", "yo": "疏肝理氣，以開放的姿態擁抱生命。", "img": "foshou", "bs": "胸悶脹氣、情緒壓抑、呼吸不暢", "rd": ["抽到佛手，是提醒你：張開手，接納那些你一直抗拒或壓著的。", "佛手性味辛、苦而溫，入肝、脾、胃、肺，中醫用它疏肝理氣、和胃化痰。它疏解得溫和，把鬱結的肝氣與滯悶的脾胃一同理順。", "如果你最近情緒壓抑、胸悶脹氣、呼吸不太順，那是肝鬱氣滯。越是緊握、越是抗拒，氣越容易堵。", "像佛手一樣張開接納的雙手。放鬆、接納、順其自然，當你不再緊繃，氣息與心情都會重新舒展。"]}, {"id": 48, "n": "砂仁", "la": "Amomum villosum", "cat": "理氣活血類", "sub": "理氣", "pr": "辛，溫", "me": "脾、胃、腎", "fn": "化濕開胃、溫脾止瀉", "af": "我喚醒感官的喜悅，重新品味生活", "mo": "「開啟封閉的胃口。」", "yo": "化濕開胃，讓堵塞的消化重新運轉。", "img": "sharen", "bs": "胸悶脹氣、情緒壓抑、呼吸不暢", "rd": ["抽到砂仁，是提醒你：重新開啟那份被關閉的胃口與熱情。", "砂仁性味辛、溫，入脾、胃、腎，中醫用它化濕開胃、溫脾止瀉。它芳香而溫，擅長化開中焦濕濁、喚回被濕困住的食慾。", "如果你最近胸悶脹氣、沒胃口、對事情也提不起興致，那是濕阻脾胃、氣機不暢。連胃口都關了，常是身心被濕悶壓著。", "溫柔地開啟封閉的胃口。化掉那股濕悶、暖一暖中焦，當脾胃重新運轉，你對食物與生活的興致也會回來。"]}, {"id": 49, "n": "金銀花", "la": "Lonicera japonica", "cat": "清熱解表類", "sub": "清熱", "pr": "甘，寒", "me": "肺、心、胃", "fn": "清熱解毒、疏散風熱", "af": "我釋放所有的毒素，讓內心清涼平靜", "mo": "「以清涼化解毒熱。」", "yo": "清熱解毒，將躁動的火焰轉為平靜。", "img": "jinyinhua", "bs": "心煩易怒、口乾舌燥、焦躁不安", "rd": ["抽到金銀花，是提醒你：以一份清涼，化解內在積聚的毒熱。", "金銀花性味甘、寒，入肺、心、胃，中醫用它清熱解毒、疏散風熱。它清而不峻，像一股甘涼的清泉，把鬱積的熱毒溫和地化開。", "如果你最近心煩、口乾、焦躁上火，甚至覺得身心都有點「發炎」，那是熱毒內蘊。積熱不散，人就容易躁、容易累。", "用清涼化解毒熱。讓自己降降火、靜一靜、多喝水，當內在的熱被化開，你會重新感到清爽平和。"]}, {"id": 50, "n": "菊花", "la": "Chrysanthemum morifolium", "cat": "清熱解表類", "sub": "清熱", "pr": "甘、苦，微寒", "me": "肺、肝", "fn": "疏風清熱、平肝明目", "af": "我放下緊繃的視線，以平和心看待世界", "mo": "「在紛擾中保持清明。」", "yo": "疏風清熱，讓過熱的頭腦冷靜下來。", "img": "juhua", "bs": "心煩易怒、口乾舌燥、焦躁不安", "rd": ["抽到菊花,是提醒你:頭腦燒得太熱了,該讓它降溫、回到清明。", "菊花性味甘、苦而微寒,入肺、肝二經,中醫用它疏風清熱、平肝明目。當肝火往上衝、腦子停不下來,菊花就像一陣清涼的風,幫你把過旺的熱氣往下帶。", "如果你最近容易心煩易怒、口乾、坐立難安,那是內在的火有點過頭了。急著解決反而更亂;先讓自己靜下來,才看得清方向。", "在紛擾之中保持清明,不是壓住情緒,而是讓它自然冷卻。放鬆那條緊繃的視線,世界會重新變得柔和。"]}, {"id": 51, "n": "決明子", "la": "Cassia obtusifolia", "cat": "清熱解表類", "sub": "清熱", "pr": "甘、苦、鹹，微寒", "me": "肝、大腸", "fn": "清肝明目、潤腸通便", "af": "我清楚看見每個選擇，明智地做出決定", "mo": "「看清真相的勇氣。」", "yo": "清肝明目，撥開迷霧看見光明。", "img": "juemingzi", "bs": "心煩易怒、口乾舌燥、焦躁不安", "rd": ["抽到決明子，是提醒你：鼓起看清真相的勇氣。", "決明子性味甘、苦、鹹而微寒，入肝、大腸，中醫用它清肝明目、潤腸通便。肝火一降，眼睛與心都會跟著清亮，看事情也更透徹。", "如果你最近心煩易怒、眼睛乾澀、內在焦躁，那是肝火偏旺。火氣上頭時，人容易看不清、也容易鑽牛角尖。", "帶著勇氣看清真相。先讓肝火降下來，把積在裡面的清一清，當視線清明，你會看見一直忽略的答案。"]}, {"id": 52, "n": "梔子", "la": "Gardenia jasminoides", "cat": "清熱解表類", "sub": "清熱", "pr": "苦，寒", "me": "心、肺、三焦", "fn": "瀉火除煩、清熱利濕、涼血解毒", "af": "我清走胸中的悶火，找回原本的寬廣", "mo": "「釋放心中的燥火。」", "yo": "瀉火除煩，讓焦躁的心歸於寧靜。", "img": "zhizi", "bs": "心煩易怒、口乾舌燥、焦躁不安", "rd": ["抽到梔子，是提醒你：把積在心裡的那股燥火，好好釋放出來。", "梔子性味苦、寒，入心、肺、三焦，中醫用它瀉火除煩、清熱利濕。它專清那種鬱在胸中、讓人翻來覆去的煩熱。", "如果你最近心煩失眠、焦躁不安、胸中悶熱，那是心火內鬱。火悶在裡面，人就靜不下來。", "釋放心中的燥火吧。別再硬壓煩躁，讓它有出口——當鬱熱被清掉，心自然會安靜下來。"]}, {"id": 53, "n": "生地黃", "la": "Rehmannia glutinosa (raw)", "cat": "清熱解表類", "sub": "清熱", "pr": "甘、苦，寒", "me": "心、肝、腎", "fn": "清熱涼血、養陰生津", "af": "我的陰陽調和平衡，內在清涼而滋潤", "mo": "「冷卻過熱的血液。」", "yo": "清熱涼血，讓沸騰的情緒平靜下來。", "img": "shengdihuang", "bs": "心煩易怒、口乾舌燥、焦躁不安", "rd": ["抽到生地黃，是提醒你：替過熱、過亢的內在降降溫。", "生地黃性味甘、苦而寒，入心、肝、腎，中醫用它清熱涼血、養陰生津。它一面清熱涼血，一面補回被熱耗傷的陰津，清中帶養。", "如果你最近心煩、口乾、燥熱睡不安，那是血熱又陰虛。火太旺、水又不夠，人就又躁又乾。", "冷卻過熱的血液，也別忘了補水。降火的同時滋陰，當內在重新清涼潤澤，焦躁會慢慢退去。"]}, {"id": 54, "n": "知母", "la": "Anemarrhena asphodeloides", "cat": "清熱解表類", "sub": "清熱", "pr": "苦、甘，寒", "me": "肺、胃、腎", "fn": "清熱瀉火、滋陰潤燥", "af": "清涼甘露滋潤我的內在，焦慮隨之平息", "mo": "「以智慧降伏虛火。」", "yo": "清熱滋陰，用理性平息內在的燃燒。", "img": "zhimu", "bs": "心煩易怒、口乾舌燥、焦躁不安", "rd": ["抽到知母，是提醒你：用智慧、而非蠻力，去降伏內在的虛火。", "知母性味苦、甘而寒，入肺、胃、腎，中醫用它清熱瀉火、滋陰潤燥。它既能清實火，又能滋陰以退虛火，清與潤兼顧。", "如果你最近心煩、口乾、燥熱難眠，那是陰虛火旺。這種火不是靠硬壓，而是要靠補水滋陰來平。", "以智慧降伏虛火。看懂焦躁背後其實是「缺水」，一面降火、一面滋養，內在就會回到清涼的平衡。"]}, {"id": 55, "n": "石膏", "la": "Gypsum Fibrosum", "cat": "清熱解表類", "sub": "清熱", "pr": "甘、辛，大寒", "me": "肺、胃", "fn": "清熱瀉火、除煩止渴", "af": "我降下憤怒的高溫，讓理智回歸平靜", "mo": "「鎮住狂奔的烈焰。」", "yo": "清熱瀉火，讓過度的熱情回歸理性。", "img": "shigao", "bs": "心煩易怒、口乾舌燥、焦躁不安", "rd": ["抽到石膏，是提醒你：那股狂奔的烈焰，需要被穩穩鎮住。", "石膏性味甘、辛而大寒，入肺、胃，是中醫清熱瀉火的猛將，專門對付熾盛的實熱大火，除煩止渴的力道十足。", "如果你最近極度心煩、口乾舌燥、焦躁得靜不下來，那是實熱亢盛。火燒得太旺時，人會坐立難安。", "鎮住那團狂奔的烈焰（大寒之品宜遵醫囑）。先讓過旺的火勢降下來，當熱退了，你才回得到清明與安定。"]}, {"id": 56, "n": "玄參", "la": "Scrophularia ningpoensis", "cat": "清熱解表類", "sub": "清熱", "pr": "甘、苦、鹹，微寒", "me": "肺、胃、腎", "fn": "清熱涼血、滋陰降火、解毒散結", "af": "我平息燃燒的火焰，展現慈悲的語言", "mo": "「深入降火，滋養根本。」", "yo": "清熱涼血，解開藏在深處的結。", "img": "xuanshen", "bs": "心煩易怒、口乾舌燥、焦躁不安", "rd": ["抽到玄參，是提醒你：降火要降得深，還要順手滋養根本。", "玄參性味甘、苦、鹹而微寒，入肺、胃、腎，中醫用它清熱涼血、滋陰降火、解毒散結。它降的是深層的虛火，一面清熱、一面補回陰液。", "如果你最近口乾咽燥、心煩焦躁、內熱難消，那是陰虛火旺、虛火上炎。表面的燥，根子往往在深處的陰虧。", "深入降火，也滋養根本。別只顧滅表面的火，把底下的陰補起來，焦躁才不會一再回來。"]}, {"id": 57, "n": "薄荷", "la": "Mentha haplocalyx", "cat": "清熱解表類", "sub": "解表", "pr": "辛，涼", "me": "肺、肝", "fn": "疏散風熱、疏肝解鬱", "af": "清新的風掠過心靈，我的思緒通透清明", "mo": "「一陣清風吹散鬱悶。」", "yo": "疏散風熱，讓窒悶的心胸豁然開朗。", "img": "bohe", "bs": "身體僵硬、畏風怕冷、頭痛不適", "rd": ["抽到薄荷，是提醒你：讓一陣清風，把積在心頭的鬱悶吹散。", "薄荷性味辛、涼，入肺、肝，中醫用它疏散風熱、疏肝解鬱。它清涼輕揚，既能疏散頭面的風熱，也能鬆開鬱結的肝氣。", "如果你最近頭脹、身體緊繃、心情也悶悶的，那是風熱夾著肝鬱。悶在裡面，人就沉、就僵。", "讓自己吹吹清風、透透氣。當鬱悶被輕輕吹散，頭會清爽、心也會跟著明亮起來。"]}, {"id": 58, "n": "桑葉", "la": "Morus alba", "cat": "清熱解表類", "sub": "解表", "pr": "甘、苦，寒", "me": "肺、肝", "fn": "疏散風熱、清肺潤燥", "af": "我疏散外在的燥熱，恢復內在的清明", "mo": "「輕柔地疏散燥熱。」", "yo": "疏散風熱，如秋葉般帶走多餘的火氣。", "img": "sangye", "bs": "身體僵硬、畏風怕冷、頭痛不適", "rd": ["抽到桑葉，是提醒你：用輕柔而非猛烈的方式，疏散內在的燥熱。", "桑葉性味甘、苦而寒，入肺、肝，中醫用它疏散風熱、清肺潤燥。它清得溫和，一面散表面的風熱，一面潤養被燥氣傷到的肺。", "如果你最近頭脹、眼乾、身體緊繃又帶點燥，那是風熱與燥邪。燥熱一上頭，人就僵、就不舒服。", "輕柔地疏散燥熱。不必用力對抗，清潤並行，當表面的熱散去、內裡被潤養，你會重新感到清爽。"]}, {"id": 59, "n": "柴胡", "la": "Bupleurum chinense", "cat": "清熱解表類", "sub": "解表", "pr": "苦、辛，微寒", "me": "肝、膽、肺", "fn": "疏散退熱、疏肝解鬱、升舉陽氣", "af": "我在起伏中找到平衡，推開心窗見陽光", "mo": "「升起被壓抑的能量。」", "yo": "疏肝解鬱，讓下沉的氣機重新上揚。", "img": "chaihu", "bs": "身體僵硬、畏風怕冷、頭痛不適", "rd": ["抽到柴胡，是提醒你：把一直被壓著的能量，重新升舉起來。", "柴胡性味苦、辛而微寒，入肝、膽、肺，中醫用它疏肝解鬱、升舉陽氣。它既能疏散鬱結，又能把下陷、低落的氣往上提。", "如果你最近情緒低落壓抑、身體發緊、提不起勁，那是肝氣鬱結、清陽不升。被壓久了，人就沉、就悶。", "升起被壓抑的能量。把鬱結疏開、把低落的氣提起來，當內在重新往上走，你會覺得整個人被撐開、變輕。"]}, {"id": 60, "n": "生薑", "la": "Zingiber officinale", "cat": "清熱解表類", "sub": "解表", "pr": "辛，微溫", "me": "肺、脾、胃", "fn": "解表散寒、溫中止嘔、化痰止咳", "af": "我擁抱生命的暖意，驅散所有寒冷與不安", "mo": "「第一道溫暖的防線。」", "yo": "解表散寒，在寒意入侵時及時驅散。", "img": "shengjiang", "bs": "身體僵硬、畏風怕冷、頭痛不適", "rd": ["抽到生薑，是提醒你：替自己築起第一道溫暖的防線。", "生薑性味辛、微溫，入肺、脾、胃，中醫用它解表散寒、溫中止嘔。它是驅散初起風寒的日常良伴，暖胃、散寒、又能安撫翻湧的不適。", "如果你最近怕風怕冷、身體發緊、有點著涼想不舒服，那是風寒初襲。這種時候，及時的溫暖最重要。", "為自己築起第一道溫暖的防線。一碗薑湯、一份保暖，把寒擋在外面，身心都會踏實安穩許多。"]}, {"id": 61, "n": "茯苓", "la": "Poria cocos", "cat": "化濕消導類", "sub": "利水滲濕", "pr": "甘、淡，平", "me": "心、脾、腎", "fn": "利水滲濕、健脾安神", "af": "我釋放不再需要的重擔，心靈安定如山", "mo": "「排出多餘的負擔。」", "yo": "利水滲濕，讓身心都變得輕盈。", "img": "fuling", "bs": "身體沉重、浮腫疲倦、頭腦昏沉", "rd": ["抽到茯苓,是身心在提醒你:是時候把那些多餘的、沉重的東西,溫和地放下了。", "茯苓性味甘、淡而平,入心、脾、腎三經,中醫用它利水滲濕、健脾安神。它不猛不烈,像默默把體內多餘的濕氣、把心裡多餘的負擔慢慢排掉的那種力量。", "如果你最近覺得身體沉重、容易浮腫疲倦、頭腦昏昏沉沉,那是「濕」滯住了,氣血運行變慢。這時候你需要的不是更用力,而是讓身心重新流動起來。", "試著清理一些不再需要的重擔——事情、關係、或心裡的執念。當多餘的被排掉,你會發現自己輕盈得多,也安定得多。"]}, {"id": 62, "n": "薏苡仁", "la": "Coix lacryma-jobi", "cat": "化濕消導類", "sub": "利水滲濕", "pr": "甘、淡，微寒", "me": "脾、胃、肺", "fn": "利水滲濕、健脾止瀉、清熱排膿", "af": "我清除所有積壓，恢復輕盈自在的狀態", "mo": "「淨化內在的濁氣。」", "yo": "利水滲濕，還給身體清爽的環境。", "img": "yiyiren", "bs": "身體沉重、浮腫疲倦、頭腦昏沉", "rd": ["抽到薏苡仁，是提醒你：清一清內在積存的濁與濕。", "薏苡仁性味甘、淡而微寒，入脾、胃、肺，中醫用它利水滲濕、健脾。它清利卻不峻，把體內多餘的濕濁溫和地排出去。", "如果你最近身體沉重、浮腫疲倦、頭腦昏沉，那是濕濁停滯、脾運不暢。濁氣一多，人就重、就懶。", "淨化內在的濁氣。清理飲食、清理環境、清理心裡的雜念，當濕濁排掉，你會覺得整個人清透、輕盈。"]}, {"id": 63, "n": "桔梗", "la": "Platycodon grandiflorus", "cat": "化濕消導類", "sub": "化痰止咳", "pr": "苦、辛，平", "me": "肺", "fn": "宣肺祛痰、利咽排膿", "af": "我打開表達的通道，聲音清晰有力", "mo": "「開啟表達的通道。」", "yo": "宣肺祛痰，讓壓抑的聲音得以釋放。", "img": "jiegeng", "bs": "胸悶痰多、呼吸不暢、表達受阻", "rd": ["抽到桔梗，是提醒你：打開那條被堵住的表達通道。", "桔梗性味苦、辛而平，入肺，中醫用它宣肺祛痰、利咽，還被視為「載藥上行」的舟楫，擅長宣開肺氣、通利咽喉。", "如果你最近胸悶痰多、呼吸不暢、有話卡在喉頭說不出，那是肺氣不宣。悶著不說，氣與情都會堵。", "開啟表達的通道。宣一宣肺、清一清喉，把想說的說出來，當氣與話都通了，胸口自然會鬆開。"]}, {"id": 64, "n": "杏仁", "la": "Prunus armeniaca", "cat": "化濕消導類", "sub": "化痰止咳", "pr": "苦，溫（有小毒）", "me": "肺、大腸", "fn": "止咳平喘、潤腸通便", "af": "我順暢地排解情緒，讓氣息回歸自然", "mo": "「潤滑生命的呼吸。」", "yo": "止咳平喘，讓每一次呼吸都順暢自如。", "img": "xingren", "bs": "胸悶痰多、呼吸不暢、表達受阻", "rd": ["抽到杏仁，是提醒你：讓生命的呼吸重新變得順暢潤滑。", "杏仁性味苦、溫（有小毒，宜遵醫囑），入肺、大腸，中醫用它止咳平喘、潤腸通便。它降氣潤肺，把上逆、乾澀的氣機往下順、往潤裡帶。", "如果你最近胸悶、呼吸不暢、身心都有點乾澀卡頓，那是肺氣上逆、失於宣降。呼吸一淺，人就緊。", "潤滑生命的呼吸。放慢、放柔，讓一呼一吸都順下來，當氣機宣降有序，緊繃會隨著吐納鬆開。"]}, {"id": 65, "n": "貝母", "la": "Fritillaria cirrhosa", "cat": "化濕消導類", "sub": "化痰止咳", "pr": "苦、甘，微寒", "me": "肺、心", "fn": "清熱潤肺、化痰止咳", "af": "我散去心中的凝結，讓哀傷轉化為力量", "mo": "「化開心肺的痰結。」", "yo": "清熱化痰，讓黏稠的鬱悶消散無蹤。", "img": "beimu", "bs": "胸悶痰多、呼吸不暢、表達受阻", "rd": ["抽到貝母，是提醒你：化開那些鬱結在心肺之間的痰與悶。", "貝母性味苦、甘而微寒，入肺、心，中醫用它清熱潤肺、化痰止咳。它清潤並行，把黏稠、鬱熱的痰結溫和地化開。", "如果你最近胸悶痰多、呼吸不暢、心裡也悶著化不開，那是痰熱鬱結。痰一結，氣不順、情也堵。", "化開心肺的痰結。清一清、潤一潤、把鬱著的疏理開，當痰與悶散去，呼吸與心情都會清朗起來。"]}, {"id": 66, "n": "神曲", "la": "Massa Medicata Fermentata", "cat": "化濕消導類", "sub": "消食", "pr": "甘、辛，溫", "me": "脾、胃", "fn": "消食和胃、健脾進食", "af": "我給予自己足夠空間，轉化所有經驗", "mo": "「發酵出新的可能。」", "yo": "消食和胃，將積壓的負擔轉化為養分。", "img": "shenqu", "bs": "腹脹不適、食慾不振、消化停滯", "rd": ["抽到神曲，是提醒你：把積著的消化掉，才發酵得出新的可能。", "神曲由多物發酵而成，性味甘、辛而溫，入脾、胃，中醫用它消食和胃、健脾。它擅長化解積滯，讓停滯的重新運轉。", "如果你最近腹脹、食慾不振、消化停滯，那是食積、脾胃運化不動。積著不消，人就悶、就重。", "相信發酵的力量。把舊的、積著的先消化掉，騰出空間，新的可能才有機會醞釀、生長。"]}, {"id": 67, "n": "萊菔子", "la": "Raphanus sativus", "cat": "化濕消導類", "sub": "消食", "pr": "辛、甘，平", "me": "肺、脾、胃", "fn": "消食除脹、降氣化痰", "af": "我順暢地排解壓力，讓心靈恢復舒坦", "mo": "「順勢而下的釋放。」", "yo": "消食降氣，讓上衝的濁氣找到出口。", "img": "laifuzi", "bs": "腹脹不適、食慾不振、消化停滯", "rd": ["抽到萊菔子，是提醒你：順著勢頭，把積壓的往下釋放。", "萊菔子性味辛、甘而平，入肺、脾、胃，中醫用它消食除脹、降氣化痰。它擅長把上逆、壅滯的氣往下順，把脹悶與痰一起帶走。", "如果你最近腹脹、噯氣、消化停滯又覺得氣往上頂，那是食積氣滯。氣不下行，人就脹、就悶。", "學會順勢而下的釋放。不必硬憋，讓該排的排、該放的放，當氣往下順，脹悶自然消解。"]}, {"id": 68, "n": "雞內金", "la": "Gallus gallus domesticus", "cat": "化濕消導類", "sub": "消食", "pr": "甘，平", "me": "脾、胃、小腸、膀胱", "fn": "健胃消食、固精止遺", "af": "我軟化內心的硬塊，讓能量自由流動", "mo": "「磨碎所有的硬塊。」", "yo": "健胃消食，再堅硬的積滯也能化解。", "img": "jineijin", "bs": "腹脹不適、食慾不振、消化停滯", "rd": ["抽到雞內金，是提醒你：把那些卡住的硬塊，一點一點磨化開。", "雞內金性味甘、平，入脾、胃、小腸、膀胱，是中醫消食化積的良藥，連頑固的積滯都能慢慢化開，消食之力很強。", "如果你最近腹脹、食慾差、消化停滯像塞了塊東西，那是積滯不化。硬塊卡著，運轉就停。", "有耐心地磨碎所有硬塊。無論是胃裡的積，還是心裡的結，一點一點化，終會被磨得順暢通透。"]}, {"id": 69, "n": "山楂", "la": "Crataegus pinnatifida", "cat": "化濕消導類", "sub": "消食", "pr": "酸、甘，微溫", "me": "脾、胃、肝", "fn": "消食化積、行氣散瘀", "af": "我消化所有積累的負擔，輕盈邁向未來", "mo": "「消化昨天的負擔。」", "yo": "消食散瘀，別讓過去的沉重擋住明天的胃口。", "img": "shanzha", "bs": "腹脹不適、食慾不振、消化停滯", "rd": ["抽到山楂，是提醒你：消化掉昨天的負擔，才走得動今天。", "山楂性味酸、甘而微溫，入脾、胃、肝，中醫用它消食化積、行氣散瘀，尤其擅長化解油膩肉食的積滯。", "如果你最近腹脹、消化停滯、心裡也堆著些化不開的事，那是積滯未消。舊的不清，新的進不來。", "好好消化昨天的負擔。把積著的食、積著的情都化一化，清空之後，你才有餘裕迎接新的一天。"]}, {"id": 70, "n": "麥芽", "la": "Hordeum vulgare", "cat": "化濕消導類", "sub": "消食", "pr": "甘，平", "me": "脾、胃、肝", "fn": "消食健胃、回乳消脹", "af": "我尊重成長的節奏，享受當下的過程", "mo": "「萌發新生的力量。」", "yo": "消食健胃，如種子破土般消化停滯。", "img": "maiya", "bs": "腹脹不適、食慾不振、消化停滯", "rd": ["抽到麥芽，是提醒你：在消化與放下之後，萌發新生的力量。", "麥芽是發芽的大麥，性味甘、平，入脾、胃、肝，中醫用它消食健胃、消脹。它一面化積消脹，一面帶著種子萌芽般的生發之氣。", "如果你最近腹脹、食慾不振、消化停滯，那是食積脾滯。積著不動，生機也跟著停。", "相信萌發新生的力量。把積滯化開、把脾胃喚醒，當阻滯一通，新的生機就會像嫩芽般冒出來。"]}, {"id": 71, "n": "琥珀", "la": "Succinum", "cat": "安神收澀類", "sub": "安神", "pr": "甘，平", "me": "心、肝、小腸、膀胱", "fn": "鎮驚安神、散瘀止血、利水通淋", "af": "我找回靈魂的家園，內在平安無懼", "mo": "「凝固的時光帶來寧靜。」", "yo": "鎮驚安神，讓千萬年的沉澱守護你。", "img": "hupo", "bs": "心神不寧、失眠多夢、驚悸不安", "rd": ["抽到琥珀，是提醒你：讓時間慢下來，在沉靜中安放紛亂的心。", "琥珀是千萬年凝結而成的樹脂，性味甘、平，入心、肝、小腸、膀胱，中醫用它鎮驚安神。它沉而定，擅長把受驚、浮動的心神穩穩鎮住。", "如果你最近心神不寧、失眠多夢、容易驚悸，那是心神失守、定不下來。心一亂，連睡都睡不安穩。", "讓凝固的時光帶來寧靜。放慢腳步、沉澱下來，當浮動的心被安放，你會重新擁有踏實的平靜。"]}, {"id": 72, "n": "酸棗仁", "la": "Ziziphus jujuba var. spinosa", "cat": "安神收澀類", "sub": "安神", "pr": "甘、酸，平", "me": "心、肝、膽", "fn": "養心補肝、寧心安神、斂汗", "af": "我的心神安寧，輕鬆進入修復的深眠", "mo": "「在溫暖中入眠。」", "yo": "養心益肝，為受驚的心蓋上一條安穩的被子。", "img": "suanzaoren", "bs": "心神不寧、失眠多夢、驚悸不安", "rd": ["抽到酸棗仁,是心在向你討一場好眠——它累了,需要被安撫。", "酸棗仁性味甘、酸而平,入心、肝、膽三經,是中醫安神助眠的常用藥,能養心補肝、寧心安神。它的溫柔在於「收」:把那顆四處飄、靜不下來的心,慢慢收攏回來。", "如果你最近心神不寧、翻來覆去睡不好、多夢易驚,那是心血與肝血養不住神了。不是你想太多,是你的心真的需要休息與滋養。", "今晚,給自己一個安穩的睡前儀式。讓緊繃鬆開,為受驚的心蓋上一條安穩的被子——你可以放心地沉沉睡去。"]}, {"id": 73, "n": "天麻", "la": "Gastrodia elata", "cat": "安神收澀類", "sub": "平肝息風", "pr": "甘，平", "me": "肝", "fn": "息風止痙、平抑肝陽", "af": "我穩住內在的重心，找回平衡的方位", "mo": "「在搖晃中找到平衡。」", "yo": "息風止痙，讓動盪的內心穩定下來。", "img": "tianma", "bs": "頭暈目眩、情緒波動、肝火上炎", "rd": ["抽到天麻，是提醒你：在搖晃動盪之中，重新找回內在的平衡。", "天麻性味甘、平，入肝，是中醫平肝息風的要藥，擅長平抑上亢的肝陽、安定那種頭暈目眩、天旋地轉的失衡感。", "如果你最近頭暈目眩、情緒起伏大、覺得站不太穩，那是肝陽上亢、內風擾動。晃動，是失衡的訊號。", "在搖晃中找到平衡。把上衝的能量安撫下來、把重心放回中央，當內風平息，你會重新站得穩、看得清。"]}, {"id": 74, "n": "牡蠣", "la": "Ostrea gigas", "cat": "安神收澀類", "sub": "平肝息風", "pr": "鹹，微寒", "me": "肝、膽、腎", "fn": "重鎮安神、平肝潛陽", "af": "我軟化內心的堅硬，讓心神沉潛回歸", "mo": "「收斂浮動的心神。」", "yo": "重鎮安神，讓飄蕩的靈魂沉入安穩。", "img": "muli", "bs": "頭暈目眩、情緒波動、肝火上炎", "rd": ["抽到牡蠣，是提醒你：把四處浮動的心神，重新收斂沉澱。", "牡蠣性味鹹、微寒，入肝、膽、腎，中醫用它重鎮安神、平肝潛陽。它質重性沉，像一枚鎮石，把上浮、飄散的陽氣與心神潛降下來。", "如果你最近頭暈、心浮氣躁、情緒容易被牽動，那是肝陽上浮、心神不潛。浮在上面，人就晃、就不安。", "收斂浮動的心神。讓自己沉下來、靜下來、往內收，當浮陽潛降，你會重新感到安穩而有重量。"]}, {"id": 75, "n": "鉤藤", "la": "Uncaria rhynchophylla", "cat": "安神收澀類", "sub": "平肝息風", "pr": "甘，涼", "me": "肝、心包", "fn": "息風定驚、清熱平肝", "af": "我放鬆臉部與心靈，平息焦躁的神經", "mo": "「平息腦海的風暴。」", "yo": "清熱息風，讓紛亂的思緒在鉤尖定格平靜。", "img": "gouteng", "bs": "頭暈目眩、情緒波動、肝火上炎", "rd": ["抽到鉤藤，是提醒你：平息腦海裡那場停不下來的風暴。", "鉤藤性味甘、涼，入肝、心包，中醫用它息風定驚、清熱平肝。它清涼柔和，擅長平息肝風、鎮定那種躁動不安的內在騷動。", "如果你最近頭暈脹、心煩躁動、思緒像風暴般停不下來，那是肝風內動、肝火偏旺。腦子太亢，人就靜不了。", "平息腦海的風暴。讓過亢的能量降下來、讓思緒慢下來，當內在的風停了，你會回到一片清明與安定。"]}, {"id": 76, "n": "地龍", "la": "Pheretima aspergillum", "cat": "安神收澀類", "sub": "平肝息風", "pr": "鹹，寒", "me": "肝、脾、膀胱", "fn": "清熱定驚、通絡、平喘、利尿", "af": "我通達全身的經絡，與萬物重新連結", "mo": "「從地底傳來的安定。」", "yo": "清熱定驚，用大地的沉穩平息風暴。", "img": "dilong", "bs": "頭暈目眩、情緒波動、肝火上炎", "rd": ["抽到地龍，是提醒你：回到最底層的、如大地般的沉穩與安定。", "地龍性味鹹、寒，入肝、脾、膀胱，中醫用它清熱定驚、通經活絡。它性沉走下，一面清熱定驚，一面把不通的經絡疏通開。", "如果你最近頭暈目眩、情緒波動大、肝火上炎、身體也覺得緊繃不通，那是熱擾兼經絡阻滯。上頭太熱、下面又堵。", "感受從地底傳來的安定。把上炎的火往下清、把不通的疏開，當能量重新接地，你會沉穩、也通暢。"]}, {"id": 77, "n": "五味子", "la": "Schisandra chinensis", "cat": "安神收澀類", "sub": "收澀", "pr": "酸、甘，溫", "me": "肺、心、腎", "fn": "收斂固澀、益氣生津、補腎寧心", "af": "我收攝散逸的能量，找回完整的自我", "mo": "「守住完整的自己。」", "yo": "五味具全，才是生命最真實且飽滿的樣子。", "img": "wuweizi", "bs": "精力渙散、容易流失、缺乏持續力", "rd": ["抽到五味子，是提醒你：把散逸在外的自己，重新收攏、守住。", "五味子五味俱全，性味以酸為主而溫，入肺、心、腎，中醫用它收斂固澀、益氣生津。它擅長「收」，把耗散的氣、津、神一併收攝回來。", "如果你最近精力渙散、容易疲乏、覺得能量一直在流失，那是氣陰耗散、收攝無力。漏得太多，人就空。", "守住完整的自己。減少無謂的消耗，把心力收回內在，當散逸的重新聚攏，你會重新感到飽滿而完整。"]}, {"id": 78, "n": "蓮子", "la": "Nelumbo nucifera (seed)", "cat": "安神收澀類", "sub": "收澀", "pr": "甘、澀，平", "me": "脾、腎、心", "fn": "補脾止瀉、益腎止遺、養心安神", "af": "我的心如蓮花般安穩，守護內在的純淨", "mo": "「在淤泥中保持純淨。」", "yo": "補脾養心，讓心如蓮花般出淤泥而不染。", "img": "lianzi", "bs": "精力渙散、容易流失、缺乏持續力", "rd": ["抽到蓮子，是提醒你：即使身處淤泥，也能守住內在的純淨與安定。", "蓮子性味甘、澀而平，入脾、腎、心，中醫用它補脾止瀉、益腎固精、養心安神。它一面收澀固守，一面安養那顆容易慌的心。", "如果你最近精力渙散、心神不寧、覺得能量與定力都在流失，那是脾腎不固、心神失養。守不住，人就慌。", "在淤泥中保持純淨。守住自己的核心與界線，不被外境帶走，當內在安穩，你自會出淤泥而不染。"]}, {"id": 79, "n": "芡實", "la": "Euryale ferox", "cat": "安神收澀類", "sub": "收澀", "pr": "甘、澀，平", "me": "脾、腎", "fn": "益腎固精、補脾止瀉", "af": "我的生命根基堅實，在穩定中獲得滋養", "mo": "「收住流失的精華。」", "yo": "益腎固精，守護身體最珍貴的能量。", "img": "qianshi", "bs": "精力渙散、容易流失、缺乏持續力", "rd": ["抽到芡實，是提醒你：把正在流失的珍貴精華，及時收住。", "芡實性味甘、澀而平，入脾、腎，中醫用它益腎固精、補脾止瀉，收澀之力扎實，擅長固守身體最根本的能量。", "如果你最近精力渙散、容易疲累、覺得底氣一直在漏，那是脾腎不固。存不住，再多也留不下。", "收住流失的精華。把根本守好、把能量留在該在的地方，當不再無謂耗漏，你會重新感到踏實有底。"]}, {"id": 80, "n": "烏梅", "la": "Prunus mume", "cat": "安神收澀類", "sub": "收澀", "pr": "酸、澀，平", "me": "肝、脾、肺、大腸", "fn": "斂肺止咳、澀腸止瀉、安蛔", "af": "我找回內在的平衡，優雅地收斂鋒芒", "mo": "「接納生命中的酸甜。」", "yo": "收斂固澀，酸澀過後的甘甜最能生津止渴。", "img": "wumei", "bs": "精力渙散、容易流失、缺乏持續力", "rd": ["抽到烏梅，是提醒你：接納生命裡的酸與甜，收斂之後自有回甘。", "烏梅性味酸、澀而平，入肝、脾、肺、大腸，中醫用它斂肺澀腸、生津。它以酸收之性，把外散的收回，也在酸澀之後生出津液與回甘。", "如果你最近精力渙散、容易流失、缺乏持續的定力，那是耗散無收。一味外放，人就乾、就空。", "接納生命中的酸甜。收斂鋒芒、沉澱自己，你會明白——酸澀過後的那份回甘，往往最能解渴。"]}, {"id": 81, "n": "山茱萸", "la": "Cornus officinalis", "cat": "安神收澀類", "sub": "收澀", "pr": "酸、澀，微溫", "me": "肝、腎", "fn": "補益肝腎、收斂固脫", "af": "我的能量飽滿固守，不再輕易流失", "mo": "「把握住滑落的力量。」", "yo": "補益肝腎，在流失前及時收斂。", "img": "shanzhuyu", "bs": "精力渙散、容易流失、缺乏持續力", "rd": ["抽到山茱萸，是提醒你：在力量滑落之前，及時把它握住。", "山茱萸性味酸、澀而微溫，入肝、腎，中醫用它補益肝腎、收斂固脫。它既能補又能收，擅長在能量將散未散之際，穩穩地固攝住。", "如果你最近精力渙散、腰膝無力、覺得元氣一點點滑走，那是肝腎不足、固攝無力。滑落中的力量，需要及時挽住。", "把握住滑落的力量。補一補根本、收一收心神，當該固守的被穩穩握住，你會重新感到充盈而穩固。"]}];
